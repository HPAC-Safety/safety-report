name: Terraform

# The AWS environment itself: VPC, RDS, Lambda, ECR, S3, CloudFront, Secrets
# Manager, log groups, alarms. The three deploy-* workflows ship artifacts INTO
# what this creates; they never create anything.
#
# Two jobs, and the split is the whole design:
#
#   infra   verifies the Terraform without touching AWS at all. It is the only
#           one that can be a required status check, because it is the only one
#           that works on a fresh clone with no account behind it.
#   plan    posts a plan against EACH account on a pull request. Needs a
#           read-only AWS role per account.
#
# There is no `apply` job here any more (issue #466, ADR-0158, CON-INF-012): a
# merge to `main` never touches AWS. The only thing that ever applies Terraform
# is deploy-environment.yml, called by release.yml (staging, on a published,
# date-tagged release) and promote.yml (production, on a maintainer's
# promotion of a staged tag), and only against the account it deploys to.
#
# `plan` SKIPS WITH A NOTICE, per account, when that account's AWS
# configuration is absent, rather than failing. Both accounts do not exist
# yet (#464/#465 are not closed by this pull request), and a permanently-red
# check trains people to merge past red — the reasoning is ADR-0011's, applied
# to the same problem. ADR-0032 records it for the single-account shape this
# generalizes.
#
# NO `paths:` FILTER, deliberately. `infra` is a required status check, and a
# required context that never reports blocks a pull request permanently — a
# path filter would do exactly that to every pull request that does not touch
# infra/. This is the trap ADR-0011 was written about. The job is under a
# minute; that is the price of the check being requirable at all.
#
# merge_group: `infra` is required, so it reports on the merge queue's
# gh-readonly-queue/main/* branch too. `plan` never runs there: its `if:`
# names pull_request only (ADR-0147).
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only a pull request's runs share a group, so a newer push to it cancels the
# older run (ADR-0147). Every other run gets a group of its own: `infra`
# reports on every main push and every merge group independently of any
# pull request's `plan`.
concurrency:
  group: terraform-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Everything is in ca-central-1. See ADR-0009 and docs/data-handling.md.
  AWS_REGION: ca-central-1
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: '0'

jobs:
  # ------------------------------------------------------------------------
  # infra — no AWS account required, so this is the check that can be required
  # ------------------------------------------------------------------------
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Versions come out of the files that pin them — infra/.terraform-version
      # and infra/.tflint-version — never out of this workflow. AGENTS.md: a tool
      # version is pinned in exactly one file, and a second copy is a copy that
      # will drift.
      - name: Install the pinned Terraform and tflint
        run: |
          set -euo pipefail
          tf_version=$(tr -d '[:space:]' < infra/.terraform-version)
          tflint_version=$(tr -d '[:space:]' < infra/.tflint-version)

          echo "Terraform $tf_version, tflint $tflint_version"

          curl -fsSL -o /tmp/terraform.zip \
            "https://releases.hashicorp.com/terraform/${tf_version}/terraform_${tf_version}_linux_amd64.zip"
          unzip -q -o /tmp/terraform.zip -d /usr/local/bin
          chmod +x /usr/local/bin/terraform

          curl -fsSL -o /tmp/tflint.zip \
            "https://github.com/terraform-linters/tflint/releases/download/${tflint_version}/tflint_linux_amd64.zip"
          unzip -q -o /tmp/tflint.zip -d /usr/local/bin
          chmod +x /usr/local/bin/tflint

          terraform version
          tflint --version

      # bootstrap.sh is POSIX sh for the same reason init-dev.sh is: it runs
      # under Git Bash on Windows, where a bashism breaks the one platform
      # nobody here tests by hand. Nothing else exercises this script — an
      # administrator runs it once, by hand, against their own session — so this
      # is the only thing standing between a typo and a failed bootstrap.
      - name: shellcheck bootstrap.sh
        run: shellcheck -s sh infra/bootstrap.sh

      - name: terraform fmt
        run: terraform -chdir=infra fmt -check -recursive -diff

      # -backend=false: initialising the real S3 backend would need AWS
      # credentials, and validation does not need state. The provider plugins
      # still come from the committed .terraform.lock.hcl, so the version this
      # validates against is the version an apply would use.
      - name: terraform init
        run: terraform -chdir=infra init -backend=false -lockfile=readonly

      - name: terraform validate
        run: terraform -chdir=infra validate

      - name: tflint
        run: |
          set -euo pipefail
          tflint --chdir=infra --init
          tflint --chdir=infra --format=compact
        env:
          # --init downloads the AWS ruleset from GitHub; unauthenticated pulls
          # are rate-limited per runner IP.
          GITHUB_TOKEN: ${{ github.token }}

  # ------------------------------------------------------------------------
  # plan — the review artifact ADR-0010 was chosen for, against both accounts
  # ------------------------------------------------------------------------
  #
  # `matrix.account` is deliberately NOT a GitHub Environment name here.
  # `infra/bootstrap.sh` (#464, PR #582) already prints AWS_PLAN_ROLE_ARN
  # alongside AWS_DEPLOY_ROLE_ARN and TF_STATE_BUCKET, for the operator to set
  # as `hpac-safety-staging`/`hpac-safety-production` GitHub Environment variables — but
  # this job cannot read that copy. `hpac-safety-plan`'s OIDC trust condition
  # matches the subject `repo:HPAC-Safety@307760008/safety-report@1341995834:pull_request`
  # (bootstrap.sh's own comment on "the plan role"), which is exactly the
  # subject a job presents when it does NOT declare `environment:` — the
  # moment a job adds `environment: hpac-safety-staging`, its subject becomes
  # `repo:...:environment:hpac-safety-staging` instead, which is what
  # `hpac-safety-deploy` trusts, not what this role trusts. Declaring
  # `environment:` here to read the existing copy would therefore break the
  # OIDC assumption this job actually needs, on top of never running at all —
  # H2 also restricts both environments' deployment branch/tag policy to the
  # release tag pattern, so a pull-request ref would be refused before any
  # step ran.
  #
  # So this job reads a second, repository-level copy of the same two
  # bootstrap.sh values, one pair per account, distinguished by suffix —
  # plain repository variables, matching bootstrap.sh's own "identifiers, not
  # secrets" treatment of these values:
  #   AWS_PLAN_ROLE_ARN_STAGING / AWS_PLAN_ROLE_ARN_PRODUCTION
  #   TF_STATE_BUCKET_STAGING   / TF_STATE_BUCKET_PRODUCTION
  # Set them from the same `infra/bootstrap.sh` output the environment copies
  # come from, just with `--repo` instead of `--env <name>` and the suffix
  # added (see docs/deployment.md "Required GitHub configuration" — this is
  # additive to #464/#582, not a replacement for it).
  plan:
    needs: infra
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - account: staging
            account_upper: STAGING
            tfvars: infra/staging.tfvars
          - account: production
            account_upper: PRODUCTION
            tfvars: infra/production.tfvars
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      # A fork pull request gets no secrets and a read-only token, so it can
      # neither assume a role nor post a comment. Checking explicitly rather than
      # relying on that, because "GitHub happens not to hand it over" is not a
      # security boundary anyone should have to look up.
      #
      # The role is hpac-safety-plan, NOT hpac-safety-deploy. The deploy role
      # trusts only the release job's own environment
      # (repo:HPAC-Safety@307760008/safety-report@1341995834:environment:hpac-<staging|production>,
      # ADR-0158), and a pull_request-triggered run presents
      # "repo:ORG@ID/REPO@ID:pull_request" — it cannot assume it, and widening it so
      # it could is precisely what ADR-0032 forbids.
      - name: Is AWS configured for ${{ matrix.account }}?
        id: configured
        env:
          PLAN_ROLE_ARN: ${{ vars[format('AWS_PLAN_ROLE_ARN_{0}', matrix.account_upper)] }}
          STATE_BUCKET: ${{ vars[format('TF_STATE_BUCKET_{0}', matrix.account_upper)] }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          if [ "$SAME_REPO" != 'true' ]; then
            echo "::notice::Fork pull request. terraform plan needs an AWS role a fork cannot be given, so it is skipped. The infra job above still validated the configuration."
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${PLAN_ROLE_ARN}" ] || [ -z "${STATE_BUCKET}" ]; then
            echo "::notice::AWS_PLAN_ROLE_ARN_${{ matrix.account_upper }} or TF_STATE_BUCKET_${{ matrix.account_upper }} is not set, so ${{ matrix.account }} has not been bootstrapped yet. Skipping terraform plan. Creating it is #464/#465; infra/README.md has the runbook."
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - if: steps.configured.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the pinned Terraform
        if: steps.configured.outputs.ready == 'true'
        run: |
          set -euo pipefail
          tf_version=$(tr -d '[:space:]' < infra/.terraform-version)
          curl -fsSL -o /tmp/terraform.zip \
            "https://releases.hashicorp.com/terraform/${tf_version}/terraform_${tf_version}_linux_amd64.zip"
          unzip -q -o /tmp/terraform.zip -d /usr/local/bin
          chmod +x /usr/local/bin/terraform

      - if: steps.configured.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars[format('AWS_PLAN_ROLE_ARN_{0}', matrix.account_upper)] }}
          role-session-name: terraform-plan-${{ matrix.account }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # Key matches infra/bootstrap.sh's own convention (#464):
      # hpac-safety/<environment>.tfstate.
      - name: terraform init
        if: steps.configured.outputs.ready == 'true'
        run: >
          terraform -chdir=infra init
          -lockfile=readonly
          -backend-config="bucket=${{ vars[format('TF_STATE_BUCKET_{0}', matrix.account_upper)] }}"
          -backend-config="key=hpac-safety/${{ matrix.account }}.tfstate"

      # -lock=false because the plan role can read the state bucket but not write
      # to it, and the S3 backend takes its lock by PUTTING a .tflock object into
      # that same bucket. A plan writes no state, so there is nothing for the lock
      # to protect; it exists to stop two APPLIES overlapping.
      # -var-file is absolute: Terraform resolves it after -chdir=infra (#615).
      - name: terraform plan
        id: plan
        if: steps.configured.outputs.ready == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          terraform -chdir=infra plan -lock=false -no-color \
            -var-file="$GITHUB_WORKSPACE/${{ matrix.tfvars }}" \
            -out=tfplan 2>&1 | tee plan.txt

      # The comment is the point of this job. A plan nobody reads is not a review
      # artifact, and a plan buried in a job log is a plan nobody reads. One
      # comment PER ACCOUNT (a distinct marker each), `-edit-last
      # --create-if-none` keeping each one to a single, updated comment across
      # pushes, matching what the coverage job does. GitHub caps a comment at
      # 65536 characters, so a long plan is tailed rather than truncated at the
      # front — the end of a plan is where the summary line is.
      - name: Comment on the pull request
        if: steps.configured.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        run: |
          set -euo pipefail
          {
            echo "<!-- terraform-plan-${{ matrix.account }} -->"
            echo "### Terraform plan — ${{ matrix.account }} — \`$PLAN_OUTCOME\`"
            echo ''
            echo '<details><summary>Plan output</summary>'
            echo ''
            echo '```terraform'
            tail -c 60000 plan.txt
            echo '```'
            echo ''
            echo '</details>'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file comment.md --edit-last --create-if-none

      # continue-on-error above let the comment be posted for a FAILED plan too,
      # which is the case a reviewer most needs to see. The job still fails.
      - name: Fail if the plan failed
        if: steps.configured.outputs.ready == 'true' && steps.plan.outcome == 'failure'
        run: |
          echo "::error::terraform plan failed for ${{ matrix.account }}. The output is in the pull request comment above."
          exit 1
