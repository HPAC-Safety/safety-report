name: Terraform

# The AWS environment itself: VPC, RDS, ECS, ECR, S3, CloudFront, SES, Secrets
# Manager, log groups, alarms. The three deploy-* workflows ship artifacts INTO
# what this creates; they never create anything.
#
# Three jobs, and the split is the whole design:
#
#   infra   verifies the Terraform without touching AWS at all. It is the only
#           one that can be a required status check, because it is the only one
#           that works on a fresh clone with no account behind it.
#   plan    posts the plan on a pull request. Needs a read-only AWS role.
#   apply   changes AWS. Merge to main only, behind the production environment.
#
# `plan` and `apply` SKIP WITH A NOTICE when the AWS configuration is absent,
# rather than failing. The AWS account does not exist yet (#32 is not closed by
# this pull request), and a permanently-red check trains people to merge past
# red — the reasoning is ADR-0011's, applied to the same problem. ADR-0032
# records it.
#
# NO `paths:` FILTER, deliberately. `infra` is a required status check, and a
# required context that never reports blocks a pull request permanently — a
# path filter would do exactly that to every pull request that does not touch
# infra/. This is the trap ADR-0011 was written about. The job is under a
# minute; that is the price of the check being requirable at all.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never two applies at once. The state lock would catch it, but a queued run is
  # a better outcome than a failed one.
  group: terraform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Everything is in ca-central-1. See ADR-0009 and docs/data-handling.md.
  AWS_REGION: ca-central-1
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: '0'

jobs:
  # ------------------------------------------------------------------------
  # infra — no AWS account required, so this is the check that can be required
  # ------------------------------------------------------------------------
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Versions come out of the files that pin them — infra/.terraform-version
      # and infra/.tflint-version — never out of this workflow. AGENTS.md: a tool
      # version is pinned in exactly one file, and a second copy is a copy that
      # will drift.
      - name: Install the pinned Terraform and tflint
        run: |
          set -euo pipefail
          tf_version=$(tr -d '[:space:]' < infra/.terraform-version)
          tflint_version=$(tr -d '[:space:]' < infra/.tflint-version)

          echo "Terraform $tf_version, tflint $tflint_version"

          curl -fsSL -o /tmp/terraform.zip \
            "https://releases.hashicorp.com/terraform/${tf_version}/terraform_${tf_version}_linux_amd64.zip"
          unzip -q -o /tmp/terraform.zip -d /usr/local/bin
          chmod +x /usr/local/bin/terraform

          curl -fsSL -o /tmp/tflint.zip \
            "https://github.com/terraform-linters/tflint/releases/download/${tflint_version}/tflint_linux_amd64.zip"
          unzip -q -o /tmp/tflint.zip -d /usr/local/bin
          chmod +x /usr/local/bin/tflint

          terraform version
          tflint --version

      # bootstrap.sh is POSIX sh for the same reason init-dev.sh is: it runs
      # under Git Bash on Windows, where a bashism breaks the one platform
      # nobody here tests by hand. Nothing else exercises this script — an
      # administrator runs it once, by hand, against their own session — so this
      # is the only thing standing between a typo and a failed bootstrap.
      - name: shellcheck bootstrap.sh
        run: shellcheck -s sh infra/bootstrap.sh

      # The CloudFront Function is real JavaScript that runs on every request to
      # both static sites, and it is reachable only from a Terraform apply. Parse
      # it here so a syntax error surfaces on the pull request rather than as a
      # 500 at the edge. Same reasoning as agent-config loading require-config:
      # see "The deploy blind spot" in .github/workflows/README.md.
      - name: CloudFront Function parses
        run: |
          set -euo pipefail
          # It is a Terraform template, so substitute the prefix before parsing.
          # A literal placeholder in a string is still valid JavaScript, but
          # substituting keeps this honest about what actually gets published.
          # shellcheck disable=SC2016  # A Terraform placeholder, not a shell one.
          sed 's|\${admin_prefix}|/admin|' infra/functions/clean-urls.js.tftpl > /tmp/clean-urls.js
          node --check /tmp/clean-urls.js

      - name: terraform fmt
        run: terraform -chdir=infra fmt -check -recursive -diff

      # -backend=false: initialising the real S3 backend would need AWS
      # credentials, and validation does not need state. The provider plugins
      # still come from the committed .terraform.lock.hcl, so the version this
      # validates against is the version an apply would use.
      - name: terraform init
        run: terraform -chdir=infra init -backend=false -lockfile=readonly

      - name: terraform validate
        run: terraform -chdir=infra validate

      - name: tflint
        run: |
          set -euo pipefail
          tflint --chdir=infra --init
          tflint --chdir=infra --format=compact
        env:
          # --init downloads the AWS ruleset from GitHub; unauthenticated pulls
          # are rate-limited per runner IP.
          GITHUB_TOKEN: ${{ github.token }}

  # ------------------------------------------------------------------------
  # plan — the review artifact ADR-0010 was chosen for
  # ------------------------------------------------------------------------
  plan:
    needs: infra
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      # A fork pull request gets no secrets and a read-only token, so it can
      # neither assume a role nor post a comment. Checking explicitly rather than
      # relying on that, because "GitHub happens not to hand it over" is not a
      # security boundary anyone should have to look up.
      #
      # The role is hpac-safety-plan, NOT hpac-safety-deploy. The deploy role
      # trusts ref:refs/heads/main and nothing else, and a pull_request-triggered
      # run presents "repo:ORG/REPO:pull_request" — it cannot assume it, and
      # widening it so it could is precisely what #32 forbids. See ADR-0032.
      - name: Is AWS configured?
        id: configured
        env:
          PLAN_ROLE_ARN: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          if [ "$SAME_REPO" != 'true' ]; then
            echo "::notice::Fork pull request. terraform plan needs an AWS role a fork cannot be given, so it is skipped. The infra job above still validated the configuration."
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${PLAN_ROLE_ARN}" ] || [ -z "${STATE_BUCKET}" ]; then
            echo "::notice::AWS_PLAN_ROLE_ARN or TF_STATE_BUCKET is not set, so the AWS environment has not been bootstrapped yet. Skipping terraform plan. Creating it is #32; infra/README.md has the runbook."
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - if: steps.configured.outputs.ready == 'true'
        uses: actions/checkout@v7

      - name: Install the pinned Terraform
        if: steps.configured.outputs.ready == 'true'
        run: |
          set -euo pipefail
          tf_version=$(tr -d '[:space:]' < infra/.terraform-version)
          curl -fsSL -o /tmp/terraform.zip \
            "https://releases.hashicorp.com/terraform/${tf_version}/terraform_${tf_version}_linux_amd64.zip"
          unzip -q -o /tmp/terraform.zip -d /usr/local/bin
          chmod +x /usr/local/bin/terraform

      - if: steps.configured.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          role-session-name: terraform-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        if: steps.configured.outputs.ready == 'true'
        run: >
          terraform -chdir=infra init
          -lockfile=readonly
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      # -lock=false because the plan role can read the state bucket but not write
      # to it, and the S3 backend takes its lock by PUTTING a .tflock object into
      # that same bucket. A plan writes no state, so there is nothing for the lock
      # to protect; it exists to stop two APPLIES overlapping.
      - name: terraform plan
        id: plan
        if: steps.configured.outputs.ready == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          terraform -chdir=infra plan -lock=false -no-color -out=tfplan 2>&1 | tee plan.txt

      # The comment is the point of this job. A plan nobody reads is not a review
      # artifact, and a plan buried in a job log is a plan nobody reads.
      #
      # `-edit-last --create-if-none` keeps ONE comment that updates on every
      # push, matching what the coverage job does. GitHub caps a comment at 65536
      # characters, so a long plan is tailed rather than truncated at the front —
      # the end of a plan is where the summary line is.
      - name: Comment on the pull request
        if: steps.configured.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        run: |
          set -euo pipefail
          {
            echo '<!-- terraform-plan -->'
            echo "### Terraform plan — \`$PLAN_OUTCOME\`"
            echo ''
            echo '<details><summary>Plan output</summary>'
            echo ''
            echo '```terraform'
            tail -c 60000 plan.txt
            echo '```'
            echo ''
            echo '</details>'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file comment.md --edit-last --create-if-none

      # continue-on-error above let the comment be posted for a FAILED plan too,
      # which is the case a reviewer most needs to see. The job still fails.
      - name: Fail if the plan failed
        if: steps.configured.outputs.ready == 'true' && steps.plan.outcome == 'failure'
        run: |
          echo '::error::terraform plan failed. The output is in the pull request comment above.'
          exit 1

  # ------------------------------------------------------------------------
  # apply — merge to main only, behind a required reviewer
  # ------------------------------------------------------------------------
  apply:
    needs: infra
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A required reviewer. Changing AWS is a deliberate act, not a side effect of
    # merging. Same environment the three deploy workflows use — see
    # docs/deployment.md.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Is AWS configured?
        id: configured
        env:
          DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_ROLE_ARN}" ] || [ -z "${STATE_BUCKET}" ]; then
            echo "::notice::AWS_DEPLOY_ROLE_ARN or TF_STATE_BUCKET is not set, so the AWS environment has not been bootstrapped yet. Skipping terraform apply. Creating it is #32; infra/README.md has the runbook."
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - if: steps.configured.outputs.ready == 'true'
        uses: actions/checkout@v7

      - name: Install the pinned Terraform
        if: steps.configured.outputs.ready == 'true'
        run: |
          set -euo pipefail
          tf_version=$(tr -d '[:space:]' < infra/.terraform-version)
          curl -fsSL -o /tmp/terraform.zip \
            "https://releases.hashicorp.com/terraform/${tf_version}/terraform_${tf_version}_linux_amd64.zip"
          unzip -q -o /tmp/terraform.zip -d /usr/local/bin
          chmod +x /usr/local/bin/terraform

      - if: steps.configured.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: terraform-apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        if: steps.configured.outputs.ready == 'true'
        run: >
          terraform -chdir=infra init
          -lockfile=readonly
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      # A fresh plan, then apply that exact plan file. Applying without one would
      # apply whatever the world looks like at apply time, which is not what the
      # reviewer approved.
      - name: terraform apply
        if: steps.configured.outputs.ready == 'true'
        run: |
          set -euo pipefail
          terraform -chdir=infra plan -no-color -out=tfplan
          terraform -chdir=infra apply -no-color tfplan

      # ADR-0010: apply on an unchanged repository must be a no-op. If a second
      # plan straight afterwards is not empty, something in this configuration
      # does not converge — a timestamp in a name, a provider default that fights
      # back — and the plan stops being trustworthy. Say so loudly rather than
      # letting it become normal.
      - name: Idempotency check
        if: steps.configured.outputs.ready == 'true'
        run: |
          set -euo pipefail
          if terraform -chdir=infra plan -detailed-exitcode -no-color; then
            echo 'Converged: a second plan is empty.'
          else
            code=$?
            if [ "$code" -eq 2 ]; then
              echo '::error::apply did not converge — a plan immediately afterwards is not empty. Something in infra/ drifts on every run. See ADR-0010.'
            fi
            exit "$code"
          fi

      - name: Publish the deploy variables
        if: steps.configured.outputs.ready == 'true'
        run: |
          set -euo pipefail
          {
            echo '### Terraform outputs'
            echo ''
            echo 'The deploy workflows read these from state rather than from duplicated GitHub variables.'
            echo ''
            echo '```json'
            terraform -chdir=infra output -json deploy_variables
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
