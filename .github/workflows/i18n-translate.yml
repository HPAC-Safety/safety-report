name: Translate locales

# Generates locales/fr-CA.json from locales/en-CA.json. On a push to main it
# opens a pull request with the result; on a same-repo pull request it commits
# straight onto that PR's own branch (ADR-0057). It NEVER pushes to main
# directly, and it never translates for a fork: a human reads the French
# before it ships. See ADR-0021 and ADR-0057.
#
# This is a separate workflow from ci.yml on purpose, and the separation is a
# security boundary rather than tidiness:
#
#   * ci.yml runs on `pull_request`, which means it runs fork-authored code. It
#     therefore only ever VERIFIES the locales — `translate-locale.mjs --check`
#     reads files and constructs no translator, so a fork cannot make this
#     repository spend an inference call, and cannot write a locale file.
#   * This workflow's `pull_request_target` trigger runs with this
#     repository's secrets regardless of where the event came from, which is
#     exactly why the translate/commit job below gates on
#     `head.repo.full_name == github.repository` before doing anything. A fork
#     PR fails that check and falls through to nothing, the same as before
#     this trigger existed — French for its new keys still only arrives after
#     merge, via the push-to-main path.
#   * The push-to-main path is unchanged: it runs on code that is already
#     merged and reviewed, or on manual dispatch.
#
# Nothing here ever sees report data. Its input is a JSON file of UI labels that
# ships in the repository. Invariant 4 in AGENTS.md — raw reports are never
# translated and never leave the system — is untouched by this job.

on:
  push:
    branches: [main]
    paths:
      - locales/en-CA.json
      - locales/glossary.json
      - locales/terms.json
      - tools/translate-locale.mjs
      - tools/translator.mjs
      - .github/workflows/i18n-translate.yml
  pull_request_target:
    paths:
      - locales/en-CA.json
      - locales/glossary.json
      - locales/terms.json
      - tools/translate-locale.mjs
      - tools/translator.mjs
      - .github/workflows/i18n-translate.yml
  workflow_dispatch:

permissions:
  contents: read

# One translation run at a time per target: the push-to-main path still
# shares one group (two overlapping runs would both branch from main and the
# second would clobber the first's pull request), and each pull request gets
# its own group so unrelated PRs never queue behind each other.
concurrency:
  group: ${{ github.event_name == 'pull_request_target' && format('i18n-translate-pr-{0}', github.event.pull_request.number) || 'i18n-translate' }}
  cancel-in-progress: false

env:
  TRANSLATION_BRANCH: chore/fr-CA-translations

jobs:
  translate:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      # Pushing the translation branch (or a same-repo PR's own branch), and
      # opening the pull request that carries the post-merge translation.
      # main itself is protected; this workflow never writes to it.
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # For a same-repo PR, pin to the head SHA the event reported rather
          # than the branch name, so a push landing between the event firing
          # and this checkout can't change what gets translated.
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}

      # The Node major is pinned in ci.yml and nowhere else — see ADR-0015 and
      # skills/deliver-hpac-change/SKILL.md. Reading it here rather than writing
      # 24 again keeps this workflow from silently disagreeing with CI.
      - name: Read the pinned Node major
        id: node
        run: |
          set -euo pipefail
          major=$(grep -m1 -oE 'node-version: [0-9]+' .github/workflows/ci.yml | grep -oE '[0-9]+$')
          if [ -z "$major" ]; then
            echo "::error::Could not read the pinned Node major out of .github/workflows/ci.yml."
            exit 1
          fi
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.major }}

      # DeepL, targeting FR-CA — the provider decided in ADR-0022, after GitHub
      # Models (which ADR-0007 named) was retired on 30 July 2026. Only the key
      # is required: the adapter picks the free or pro host from the key's ':fx'
      # suffix, and defaults formality to prefer_more. Without DEEPL_API_KEY the
      # tool reports which keys are waiting and changes nothing.
      #
      # The remaining variables exist so a second provider is a settings change
      # rather than a code change. They are all unset by default.
      - name: Translate what changed
        id: translate
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          TRANSLATION_FORMALITY: ${{ vars.TRANSLATION_FORMALITY }}
          TRANSLATION_PROVIDER: ${{ vars.TRANSLATION_PROVIDER }}
          TRANSLATION_ENDPOINT: ${{ vars.TRANSLATION_ENDPOINT }}
          TRANSLATION_MODEL: ${{ vars.TRANSLATION_MODEL }}
          TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
        run: node tools/translate-locale.mjs --generate --locales locales

      # Same-repo pull request (ADR-0057): commit the result straight onto the
      # PR's own branch instead of opening a second one — the PR under review
      # already carries the human-reads-the-French step ADR-0021 requires.
      #
      # A push authored by the built-in GITHUB_TOKEN does not trigger
      # workflows — GitHub's loop protection — so ci.yml would never re-run on
      # this commit. TRANSLATION_PR_TOKEN (see below) is what makes that
      # happen; without it the commit still lands, it just needs a manual
      # nudge (an empty commit, or closing/reopening the PR) before checks
      # re-run.
      - name: Commit the translation onto the pull request's own branch
        if: github.event_name == 'pull_request_target' && steps.translate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.TRANSLATION_PR_TOKEN || github.token }}
          USING_DEFAULT_TOKEN: ${{ secrets.TRANSLATION_PR_TOKEN == '' }}
          SUMMARY: ${{ steps.translate.outputs.summary }}
        run: |
          set -euo pipefail

          if [ "$USING_DEFAULT_TOKEN" = 'true' ]; then
            echo "::warning::No TRANSLATION_PR_TOKEN is set, so this commit is pushed with the built-in GITHUB_TOKEN and CI will not re-run on it. Push an empty commit, or close and reopen the PR, before merging. See ADR-0021/ADR-0057."
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git add locales/fr-CA.json locales/fr-CA.meta.json
          if [ -f locales/.fr-CA.pending ]; then
            git add locales/.fr-CA.pending
          fi
          git commit -m 'Translate new/changed locale keys' -m "$SUMMARY."
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      # A pull request opened with the built-in GITHUB_TOKEN does not trigger
      # workflows — GitHub's loop protection — so CI would never report on it and
      # the required checks would sit unfulfilled forever. TRANSLATION_PR_TOKEN
      # is what makes CI run on the translation pull request: a fine-grained PAT
      # scoped to THIS repository, with Contents and Pull requests both set to
      # "Read and write", and nothing else. Never a classic PAT — its `repo`
      # scope reaches every repository the user can see.
      #
      # Without it the pull request is still opened and is still correct; it just
      # has to be nudged by hand (close and reopen it, or push an empty commit)
      # before it can merge. That trade-off is recorded in ADR-0021, and the
      # warning below is what tells whoever reads the run which happened.
      - name: Open a pull request with the French
        if: github.event_name != 'pull_request_target' && steps.translate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.TRANSLATION_PR_TOKEN || github.token }}
          USING_DEFAULT_TOKEN: ${{ secrets.TRANSLATION_PR_TOKEN == '' }}
          SUMMARY: ${{ steps.translate.outputs.summary }}
        run: |
          set -euo pipefail

          if [ "$USING_DEFAULT_TOKEN" = 'true' ]; then
            echo "::warning::No TRANSLATION_PR_TOKEN is set, so this pull request is opened with the built-in GITHUB_TOKEN and CI will not run on it. Close and reopen it, or push an empty commit, before merging. See ADR-0021."
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git switch -C "$TRANSLATION_BRANCH"
          # .fr-CA.pending is a one-time sentinel for the initial generation;
          # translate-locale.mjs deletes it once fr-CA.json exists, so later
          # runs have nothing to add for it.
          git add locales/fr-CA.json locales/fr-CA.meta.json
          if [ -f locales/.fr-CA.pending ]; then
            git add locales/.fr-CA.pending
          fi
          git commit -m 'Regenerate the French UI strings' -m "$SUMMARY."

          # Force, because the branch is rebuilt from main every run. It carries
          # nothing a human wrote — every hand-written French string lives in
          # locales/glossary.json, on main.
          git push --force origin "$TRANSLATION_BRANCH"

          {
            printf '%s\n\n' "$SUMMARY."
            cat <<'MD'
          Generated by `.github/workflows/i18n-translate.yml` from `locales/en-CA.json`.

          **Read the French before merging.** Everything here is machine output except
          keys stamped `provider: "glossary"`, which are HPAC's own wording copied
          verbatim from `locales/glossary.json`.

          Every generated key carries `reviewed: false` in `locales/fr-CA.meta.json`.
          Flip it to `true` as you check each one — that flag is the record of what a
          human has actually read, and nothing in the job ever sets it.

          Do not hand-edit `locales/fr-CA.json` to fix a translation; the next run
          regenerates it. Fix the English, or pin the term in `locales/glossary.json`.
          A word that must always translate one way (`upload` → *téléverser*) goes in
          `locales/terms.json` (ADR-0102): the translator is told it, and the i18n
          check fails on French that breaks it.

          See `docs/decisions/ADR-0021-ci-translation-opens-a-pull-request.md`.
          MD
          } > "$RUNNER_TEMP/pr-body.md"

          # One pull request that updates, rather than a new one every run.
          if gh pr view "$TRANSLATION_BRANCH" --json number --jq .number >/dev/null 2>&1; then
            gh pr edit "$TRANSLATION_BRANCH" --body-file "$RUNNER_TEMP/pr-body.md"
            echo 'Updated the open translation pull request.'
          else
            gh pr create \
              --base main \
              --head "$TRANSLATION_BRANCH" \
              --title 'Regenerate the French UI strings' \
              --body-file "$RUNNER_TEMP/pr-body.md"
          fi
