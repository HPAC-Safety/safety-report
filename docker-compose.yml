# Local dev only. Not used by CI or production — see docs/decisions/ADR-0015
# (init-dev.sh, machine bootstrap) and dev-up.sh (this file's counterpart,
# builds the api image and brings these services up).
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: hpac_safety
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    image: hpacsafety-api:dev
    pull_policy: never
    depends_on:
      - postgres
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__HpacSafety: "Host=postgres;Port=5432;Database=hpac_safety;Username=postgres;Password=postgres;Options=-c hpac.seed_development_admin=true"
    ports:
      - "8080:8080"

  web:
    image: node:22-alpine
    working_dir: /repo/src/web
    depends_on:
      - api
    volumes:
      - .:/repo
      - web-node-modules:/repo/src/web/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"

volumes:
  postgres-data:
  web-node-modules:
