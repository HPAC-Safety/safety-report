name: Linked issue

# The pull-request body checks, one job each:
#
# - linked-issue: the body closes an issue;
# - no-session-link: the body carries no agent session link (ADR-0107);
# - screenshots: a rendered web change links its screenshots, or says why it
#   needs none (ADR-0142).
#
# Nothing in GitHub's settings can force a pull request to close its issue. The
# only mechanism is a closing keyword in the pull request body, which becomes the
# squash commit message because the repository is configured with
# squash_merge_commit_message=PR_BODY. So the body is what gets enforced.
#
# This lives in its own workflow rather than in ci.yml so it can subscribe to
# `edited`. Fixing the body must re-run the check; re-running the whole build to
# do it would be absurd.
#
# merge_group: the merge queue waits for every required context on its
# gh-readonly-queue/main/* branch, and a merge group has no pull request body.
# Each job reports there under its own id. linked-issue and screenshots pass
# through with a notice: they already passed on the pull request, and neither
# can collide with another pull request. no-session-link checks each queued
# squash commit's message instead, because that is what reaches public
# history (ADR-0147).
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read

# Queued, never cancelled in progress. A body edit and a push land on the same
# commit within seconds; cancelling the older run left its "cancelled" result
# as the latest one for a required context, and the pull request blocked until
# someone re-ran it (#547). These jobs take seconds, so the newer run simply
# waits, and it always finishes last. A merge group's ref is its own queue
# branch, so queue runs never share a group (ADR-0147).
concurrency:
  group: linked-issue-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linked-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Merge group - the pull request's body was checked before it queued
        if: github.event_name == 'merge_group'
        run: echo "::notice::Checked on the pull request; a merge group has no body (ADR-0147)."

      # Runs from the pull request's checkout: this job holds a read-only token.
      - uses: actions/checkout@v7
        if: github.event_name != 'merge_group'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: github.event_name != 'merge_group'
        with:
          node-version: 24

      - name: Body closes an issue
        if: github.event_name != 'merge_group'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_ACTOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: node tools/github/check-linked-issue.ts

  # The body becomes the squash commit message on a public repository, so a
  # coding agent's session link in it would publish that session. The agents
  # whose links are refused are a collection in the tool (ADR-0107). No bot
  # exemption: no author may publish one.
  #
  # On merge_group it checks what will actually reach main: each queued squash
  # commit's message, fixed when the queue built the group. A body edited
  # after queuing does not eject the entry, and no commit-msg hook runs on a
  # server-side squash, so this is the last place to catch it (ADR-0147).
  no-session-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'merge_group' && '0' || '1' }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Body carries no agent session link
        if: github.event_name != 'merge_group'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node tools/github/check-agent-session-links.ts

      - name: Each queued commit message carries no agent session link
        if: github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: node tools/github/check-merge-group-session-links.ts

  # A pull request that changes a rendered web file links its screenshots, or
  # says why it has none (ADR-0142). The rule lives in the tool, which reads
  # only the body and the changed-file list; it decides for itself whether the
  # pull request touches a rendered file, so the job runs on every one. Actions
  # sets GITHUB_REPOSITORY, which pins the screenshot links to this repository.
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Merge group - the pull request's body was checked before it queued
        if: github.event_name == 'merge_group'
        run: echo "::notice::Checked on the pull request; a merge group has no body (ADR-0147)."

      - uses: actions/checkout@v7
        if: github.event_name != 'merge_group'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: github.event_name != 'merge_group'
        with:
          node-version: 24

      - name: A rendered web change shows its screenshots
        if: github.event_name != 'merge_group'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tools/github/check-pr-screenshots-diff.ts
