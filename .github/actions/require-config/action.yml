name: Require configuration
description: >
  Fail with a clear, named error when a deploy-time secret or variable is
  missing, instead of failing deep inside an AWS CLI call with an opaque one.

# No expression syntax anywhere in this file, not even inside a description.
# GitHub template-evaluates a manifest in full, and the `secrets` context does
# not exist at that point - a worked example in a description string is enough
# to make the whole action fail to load. See issue #36.

inputs:
  secrets:
    description: >
      Newline-separated NAME=value pairs, one per line, where the caller
      interpolates each value from the secrets context. Only the NAME is ever
      printed; Actions masks the value in any case.
    required: false
    default: ''
  variables:
    description: 'Newline-separated NAME=value pairs, same form as `secrets`.'
    required: false
    default: ''
  context:
    description: 'Sentence appended to the failure output, naming what to do next.'
    required: false
    default: 'See docs/deployment.md.'

runs:
  using: composite
  steps:
    - shell: bash
      env:
        REQUIRED_SECRETS: ${{ inputs.secrets }}
        REQUIRED_VARIABLES: ${{ inputs.variables }}
        FAILURE_CONTEXT: ${{ inputs.context }}
      # The action runs from its own checkout (a local action only resolves
      # after actions/checkout, so the repository tree is always there), and
      # GITHUB_ACTION_PATH is this directory: the script is three levels up.
      run: node "$GITHUB_ACTION_PATH/../../../tools/infra/require-config.ts"
