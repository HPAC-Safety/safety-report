name: Translate locales

# Generates locales/fr-CA.json from locales/en-CA.json. On a push to main it
# opens a pull request with the result; on a same-repo pull request it commits
# straight onto that PR's own branch (ADR-0057). It NEVER pushes to main
# directly, and it never translates for a fork: a human reads the French
# before it ships. See ADR-0021 and ADR-0057.
#
# This is a separate workflow from ci.yml on purpose, and the separation is a
# security boundary rather than tidiness:
#
#   * ci.yml runs on `pull_request`, which means it runs fork-authored code. It
#     therefore only ever VERIFIES the locales — `translate-locale.mjs --check`
#     reads files and constructs no translator, so a fork cannot make this
#     repository spend an inference call, and cannot write a locale file.
#   * This workflow's `pull_request_target` trigger runs with this
#     repository's secrets regardless of where the event came from, which is
#     exactly why the translate/commit job below gates on
#     `head.repo.full_name == github.repository` before doing anything. A fork
#     PR fails that check and falls through to nothing, the same as before
#     this trigger existed — French for its new keys still only arrives after
#     merge, via the push-to-main path.
#   * The push-to-main path is unchanged: it runs on code that is already
#     merged and reviewed, or on manual dispatch.
#
# It never runs on, or pushes to, the merge queue's gh-readonly-queue/*
# branches: pull_request_target does not fire for a merge group, and `push`
# is filtered to main. ci.yml's `i18n` job checks the French on the merged
# tree instead (ADR-0147).
#
# Nothing here ever sees report data. Its input is a JSON file of UI labels that
# ships in the repository. Invariant 4 in AGENTS.md — raw reports are never
# translated and never leave the system — is untouched by this job.
#
# The job also reports its own outcome to every open issue labelled
# `verify:translation-run` — an issue that can only be settled by a run that
# actually calls the provider (e.g. #614: does Gemini follow the term list?).
# When the run exercised the provider, it comments with what happened and
# closes the issue if the result passed the i18n check; when the run failed,
# it comments with the provider's error and leaves the issue open. Nothing has
# to poll for a run nobody can schedule.

on:
  push:
    branches: [main]
    paths:
      - locales/en-CA.json
      - locales/glossary.json
      - locales/terms.json
      - tools/i18n/translate-locale.mjs
      - tools/i18n/translator.mjs
      - tools/i18n/open-translation-pr.mjs
      - tools/i18n/report-translation-run.mjs
      - tools/github/commit-to-pr-branch.mjs
      - tools/github/read-node-major.mjs
      - tools/lib/actions.mjs
      - .github/workflows/i18n-translate.yml
  pull_request_target:
    paths:
      - locales/en-CA.json
      - locales/glossary.json
      - locales/terms.json
      - tools/i18n/translate-locale.mjs
      - tools/i18n/translator.mjs
      - tools/i18n/open-translation-pr.mjs
      - tools/i18n/report-translation-run.mjs
      - tools/github/commit-to-pr-branch.mjs
      - tools/github/read-node-major.mjs
      - tools/lib/actions.mjs
      - .github/workflows/i18n-translate.yml
  workflow_dispatch:

permissions:
  contents: read

# One translation run at a time per target: the push-to-main path still
# shares one group (two overlapping runs would both branch from main and the
# second would clobber the first's pull request), and each pull request gets
# its own group so unrelated PRs never queue behind each other.
concurrency:
  group: ${{ github.event_name == 'pull_request_target' && format('i18n-translate-pr-{0}', github.event.pull_request.number) || 'i18n-translate' }}
  cancel-in-progress: false

env:
  TRANSLATION_BRANCH: chore/fr-CA-translations

jobs:
  translate:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      # Pushing the translation branch (or a same-repo PR's own branch), and
      # opening the pull request that carries the post-merge translation.
      # main itself is protected; this workflow never writes to it.
      contents: write
      pull-requests: write
      # Commenting on, and closing, the issues labelled verify:translation-run
      # — the built-in token is enough for that, and no PAT is used for it.
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          # For a same-repo PR, pin to the head SHA the event reported rather
          # than the branch name, so a push landing between the event firing
          # and this checkout can't change what gets translated.
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
          # A persisted GITHUB_TOKEN header outranks the PAT the push steps
          # put on the remote URL, and a push made with it needs a maintainer
          # to approve CI (lesson 0018).
          persist-credentials: false

      # The Node major is pinned in ci.yml and nowhere else — see ADR-0015 and
      # skills/deliver-hpac-change/SKILL.md. Reading it here rather than writing
      # 24 again keeps this workflow from silently disagreeing with CI.
      - name: Read the pinned Node major
        id: node
        run: node tools/github/read-node-major.mjs .github/workflows/ci.yml

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.major }}

      # Gemini, en-CA to fr-CA (ADR-0179), with the one versioned prompt in
      # locales/translation-prompt.v2.md and the term list in locales/terms.json
      # sent with every request. The key is the repository's existing
      # GEMINI_API_KEY_DEV secret, the same paid key summaries use in
      # development; there is no translation-only key. Without it the tool
      # reports which keys are waiting and changes nothing.
      #
      # The variables are optional tuning, unset by default: the model defaults
      # to gemini-3.7-flash and the reasoning effort to low.
      - name: Translate what changed
        id: translate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_DEV }}
          # Kept, dormant (ADR-0179): read only when TRANSLATION_PROVIDER is
          # set to deepl, so DeepL can be switched back.
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          TRANSLATION_FORMALITY: ${{ vars.TRANSLATION_FORMALITY }}
          TRANSLATION_PROVIDER: ${{ vars.TRANSLATION_PROVIDER }}
          TRANSLATION_ENDPOINT: ${{ vars.TRANSLATION_ENDPOINT }}
          TRANSLATION_MODEL: ${{ vars.TRANSLATION_MODEL }}
          TRANSLATION_REASONING_EFFORT: ${{ vars.TRANSLATION_REASONING_EFFORT }}
        # The output is kept in a file as well as the log, so a failure can be
        # quoted to the issues waiting on this run. It holds UI strings and
        # the provider's status line, never a secret: the key travels in a
        # header the tool never prints. `shell: bash` runs with pipefail, so a
        # failed translation fails the step instead of hiding behind tee.
        shell: bash
        run: node tools/i18n/translate-locale.mjs --generate --locales locales 2>&1 | tee "$RUNNER_TEMP/translate.log"

      # Same-repo pull request (ADR-0057): commit the result straight onto the
      # PR's own branch instead of opening a second one — the PR under review
      # already carries the human-reads-the-French step ADR-0021 requires.
      #
      # A push authored by the built-in GITHUB_TOKEN does not trigger
      # workflows — GitHub's loop protection — so ci.yml would never re-run on
      # this commit. TRANSLATION_PR_TOKEN (see below) is what makes that
      # happen; without it the commit still lands, it just needs a manual
      # nudge (an empty commit, or closing/reopening the PR) before checks
      # re-run.
      - name: Commit the translation onto the pull request's own branch
        id: commit_to_pr
        if: github.event_name == 'pull_request_target' && steps.translate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.TRANSLATION_PR_TOKEN || github.token }}
          USING_DEFAULT_TOKEN: ${{ secrets.TRANSLATION_PR_TOKEN == '' }}
          SUMMARY: ${{ steps.translate.outputs.summary }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # traceability.yml may have committed onto the same branch for the
        # same push. Its commit changes nothing below, so it started no run
        # of this workflow; the tool replays this commit on top of it
        # (ADR-0113). --paths is this workflow's pull_request_target paths,
        # verbatim; tests/js/github/push-to-pr-branch.test.mjs fails if they
        # disagree.
        run: |
          node tools/github/commit-to-pr-branch.mjs \
            --adr ADR-0021/ADR-0057 \
            --add 'locales/fr-CA.json,locales/fr-CA.meta.json' \
            --add-if-exists 'locales/.fr-CA.pending' \
            --subject 'Translate new/changed locale keys' \
            --body-env SUMMARY \
            --paths 'locales/en-CA.json,locales/glossary.json,locales/terms.json,tools/i18n/translate-locale.mjs,tools/i18n/translator.mjs,tools/i18n/open-translation-pr.mjs,tools/i18n/report-translation-run.mjs,tools/github/commit-to-pr-branch.mjs,tools/github/read-node-major.mjs,tools/lib/actions.mjs,.github/workflows/i18n-translate.yml'

      # A pull request opened with the built-in GITHUB_TOKEN does not trigger
      # workflows — GitHub's loop protection — so CI would never report on it and
      # the required checks would sit unfulfilled forever. TRANSLATION_PR_TOKEN
      # is what makes CI run on the translation pull request: a fine-grained PAT
      # scoped to THIS repository, with Contents and Pull requests both set to
      # "Read and write", and nothing else. Never a classic PAT — its `repo`
      # scope reaches every repository the user can see.
      #
      # Without it the pull request is still opened and is still correct; it just
      # has to be nudged by hand (close and reopen it, or push an empty commit)
      # before it can merge. That trade-off is recorded in ADR-0021, and the
      # warning below is what tells whoever reads the run which happened.
      - name: Open a pull request with the French
        id: open_pr
        if: github.event_name != 'pull_request_target' && steps.translate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.TRANSLATION_PR_TOKEN || github.token }}
          USING_DEFAULT_TOKEN: ${{ secrets.TRANSLATION_PR_TOKEN == '' }}
          SUMMARY: ${{ steps.translate.outputs.summary }}
        run: node tools/i18n/open-translation-pr.mjs

      # The same i18n check ci.yml runs, including the term-list rule
      # (ADR-0102), on the French this run just produced. It never fails the
      # job: the French is already committed where a person reads it, and
      # ci.yml fails that pull request on the same check. Its verdict only
      # decides what the report below says, and whether it closes anything.
      - name: Check the French this run produced
        id: verify
        if: steps.translate.outputs.translated != '' && steps.translate.outputs.translated != '0'
        continue-on-error: true
        run: node tools/i18n/translate-locale.mjs --check --locales locales

      # `translated` — not `keys` — is what says the provider was actually
      # called: `keys` also counts glossary pins, hand-edits recorded as human,
      # and removals, none of which reach a provider. A run that translated
      # nothing settles nothing, so it leaves every waiting issue alone.
      - name: Report to the issues waiting on a translation run
        if: success() && steps.translate.outputs.translated != '' && steps.translate.outputs.translated != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TRANSLATED: ${{ steps.translate.outputs.translated }}
          TRANSLATED_KEYS: ${{ steps.translate.outputs.translated_keys }}
          CHECK_OUTCOME: ${{ steps.verify.outcome }}
          PROVIDER: ${{ vars.TRANSLATION_PROVIDER || vars.TRANSLATION_MODEL || 'gemini-3.7-flash' }}
        run: node tools/i18n/report-translation-run.mjs success

      # A failed run is exactly what some of those issues wait to hear about —
      # a provider rejecting a request shape answers with a status line the
      # tool prints ("The translation provider answered 400 …"). Quote it,
      # name the failed step, and leave the issue open for a person.
      - name: Report a failed run to the issues waiting on one
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OUTCOMES: >-
            node=${{ steps.node.outcome }}
            translate=${{ steps.translate.outcome }}
            commit_to_pr=${{ steps.commit_to_pr.outcome }}
            open_pr=${{ steps.open_pr.outcome }}
        run: node tools/i18n/report-translation-run.mjs failure
