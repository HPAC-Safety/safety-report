name: CI

# Public repository. Fork pull requests run here, so this workflow uses
# `pull_request` and NEVER `pull_request_target` — the latter would run
# fork-authored code with a write token and repository secrets in scope.
#
# No job below reads a secret. Anything that needs one (the Anthropic client,
# for instance) runs against recorded fixtures instead. Keep it that way.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Job ids are the status-check contexts named in docs/github-ruleset.json.
  # Renaming a job renames the context and silently drops it from the required
  # set — the ruleset keeps waiting on a name nothing reports.

  # NOT a `paths:` filter on the trigger above — that is the trap ADR-0011 and
  # terraform.yml document: a required context whose *workflow* never runs
  # never reports, and blocks every pull request permanently. This job-level
  # `if:` is different in kind, not just detail: the workflow above still
  # triggers unconditionally, so `changes` always runs and every job below
  # always gets scheduled; it just completes as "skipped" rather than running
  # its real steps when the paths it cares about did not change. GitHub treats
  # a skipped job as passing for required-status-check purposes. See ADR-0039.
  changes:
    runs-on: ubuntu-latest
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
      web: ${{ steps.filter.outputs.web }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            dotnet:
              - 'src/**'
              - 'tests/**'
              - 'global.json'
              - 'HpacSafety.slnx'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'coverlet.runsettings'
              - 'init-dev.sh'
              - '.github/workflows/ci.yml'
            web:
              - 'src/web/**'
              - '.github/workflows/ci.yml'
            e2e:
              - 'src/web/**'
              - 'tests/e2e/**'
              - '.github/workflows/ci.yml'

  build:
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Preinstalled on the runner. init-dev.sh is POSIX sh, not bash: Windows
      # contributors run it under Git Bash, so a bashism would break the one
      # platform nobody here tests on by hand. See ADR-0015.
      # The hook is POSIX sh for the same reason, and it grew real branching
      # when its two checks were made independent (#207) — a bashism or an
      # unguarded cd there breaks committing, not CI, so it is worth linting.
      - name: shellcheck init-dev.sh and the pre-commit hook
        run: shellcheck -s sh init-dev.sh .githooks/pre-commit

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore HpacSafety.slnx
      - run: dotnet format HpacSafety.slnx --verify-no-changes --no-restore
      # Directory.Build.props sets TreatWarningsAsErrors, so a warning already
      # fails. --warnaserror is belt and braces for anything outside that scope.
      - run: dotnet build HpacSafety.slnx --configuration Release --no-restore --warnaserror

  test:
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Exercises the version parsing on every pull request. setup-dotnet and
      # setup-node above have already satisfied the versions init-dev.sh reads
      # out of global.json and this file, so a failure here means the script
      # stopped agreeing with the files that pin them - which is exactly the
      # drift ADR-0015 exists to prevent. --check installs nothing.
      - name: init-dev.sh --check
        run: ./init-dev.sh --check

      # @ui-tagged scenarios execute via playwright-bdd (tests/e2e), not
      # Reqnroll — see ADR-0053. The acceptance suite skips them itself, so a
      # bare `dotnet test` is already correct (ADR-0073); this filter is a
      # second line of defence, keeping the job green even if that hook
      # regresses. Reqnroll's xUnit generator emits a `[Trait("Category", tag)]`
      # per Gherkin tag, which is what this filters on. UiScenarioHooksTests is
      # what actually catches a removed hook, since this filter would hide it.
      - name: dotnet test
        run: dotnet test HpacSafety.slnx --configuration Release --filter "Category!=ui"

      # The suite is passed as an explicit file list rather than as a
      # directory: `node --test tests/js` resolves the path as a module and
      # fails with MODULE_NOT_FOUND on the pinned Node.
      - name: node --test
        run: |
          suite=$(find tests/js -name '*.test.mjs' -o -name '*.test.js' 2>/dev/null)
          if [ -n "$suite" ]; then
            # shellcheck disable=SC2086
            node --test $suite
          else
            echo "::notice::No JavaScript test suite yet — added by #8. Skipping."
          fi

  # Parses every features/**/*.feature file with the official @cucumber/gherkin
  # parser (the same parser cucumber-js uses), pinned in
  # tools/gherkin/package.json. Syntax only — these are specification
  # documents, not an executable suite, so there are no step definitions to run
  # them against. See features/README.md.
  cucumber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Gherkin feature files parse
        run: |
          npm --prefix tools/gherkin ci
          node tools/gherkin/verify.mjs

  # Every tracked markdown file declares its title, description, and type
  # (ADR-0087). The Worker's runtime prompts are exempt - their bytes are the
  # model payload - and the validator names that exemption itself. The
  # pre-commit hook runs the same check over staged markdown, so this is the
  # backstop for a commit made without it, not the only place the rule lives.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Every markdown file declares what it is
        run: node tools/check-frontmatter.mjs

      # The matrix is generated from the claim tags and the CON ids, so a
      # scenario added without an id, a duplicate, or a constraint naming a
      # claim that does not exist fails here. Regenerating and diffing also
      # catches a committed matrix that no longer matches the artifacts it
      # summarizes - the same shape as "No drift from installing skills" and
      # dotnet format --verify-no-changes. ADR-0084.
      - name: The traceability matrix matches the specification
        run: |
          set -euo pipefail
          node tools/traceability.mjs
          if ! git diff --exit-code --stat -- docs/traceability.md; then
            echo "::error file=docs/traceability.md::Out of date. Run 'node tools/traceability.mjs' and commit the result."
            git diff -- docs/traceability.md
            exit 1
          fi

  # Cannot judge whether a change is behavioral - only a human/agent can - so
  # this flags the shape and lets a human answer. It began as the specific gap
  # issue #163 found (PR #156 added Playwright coverage for the mobile
  # hamburger nav and no .feature scenario) and was scoped to src/web/src/**,
  # which left every other behavior change unguarded: the API, the Worker,
  # Core and Infrastructure could all ship without a scenario while the rule
  # in AGENTS.md said otherwise. It now covers all of src/**.
  #
  # Exclusions: tests/e2e/steps/**/*.ts, because step definitions are the
  # execution half of a scenario per ADR-0053, not a second place requiring
  # one; .features-gen, which is generated output; and src/**/README.md, which
  # documents a component and cannot change its behavior. Everything else in
  # src/** is judged by a person, with the PR-body opt-out for the genuine
  # false positives (styling only, refactor, dependency bump).
  feature-coverage:
    needs: changes
    if: (needs.changes.outputs.dotnet == 'true' || needs.changes.outputs.e2e == 'true') && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Behavior changes are covered by a .feature scenario
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if printf '%s' "$PR_BODY" | grep -Eiq '^No `?\.feature`? scenario needed:'; then
            echo "::notice::PR body opts out of .feature scenario coverage."
            exit 0
          fi

          # ':(glob)' magic is required for '**' to match — git's default
          # pathspec matching (fnmatch, no FNM_PATHNAME) treats a bare '**'
          # as a single '*' and silently fails to match nested paths.
          changed_behavior=$(git diff --name-only "$BASE_SHA"...HEAD -- ':(glob)src/**' ':(glob)tests/e2e/**/*.ts' \
            | grep -v '/\.features-gen/' \
            | grep -v '^tests/e2e/steps/' \
            | grep -v '/README\.md$' || true)
          changed_features=$(git diff --name-only "$BASE_SHA"...HEAD -- ':(glob)features/**/*.feature' || true)

          if [ -n "$changed_behavior" ] && [ -z "$changed_features" ]; then
            echo "::error::This pull request changes behavior under src/ or e2e test code but touches no features/**/*.feature file."
            echo ""
            echo "Changed files with no matching scenario:"
            printf '%s\n' "$changed_behavior"
            echo ""
            echo "AGENTS.md requires the scenario to be written before the"
            echo "implementation, and updated in the same pull request when"
            echo "behavior changes (ADR-0083)."
            echo ""
            echo "If this change is genuinely not user-facing (styling only, refactor,"
            echo "dependency bump), add a line to the pull request body:"
            echo ""
            echo "    No .feature scenario needed: <reason>"
            exit 1
          fi

          echo "::notice::Behavior changes are covered by a matching .feature change, or none were made."

  coverage:
    # Depends on e2e (not just changes) so it can download that job's
    # Playwright test count instead of reinstalling Playwright itself — see
    # the "Count Playwright tests" step on the e2e job and #263. e2e is
    # itself conditional, so `always()` plus the explicit result check is
    # needed: a plain `needs: e2e` would skip this job whenever e2e does.
    needs: [changes, e2e]
    if: >-
      always() &&
      (needs.changes.outputs.dotnet == 'true' || needs.changes.outputs.e2e == 'true') &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reading the baseline artifact from main's last green run.
      actions: read
      # Posting the summary comment. Fork pull requests get a read-only token,
      # so the comment step is skipped for them - see the step's condition.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Restore tools
        run: dotnet tool restore

      # coverlet.runsettings excludes generated code. Without it the API reports
      # 4.8% while Program.cs is at 100%, because the OpenApi source generator
      # emits ~440 lines into obj/ that no test will ever run.
      # @ui-tagged scenarios execute via playwright-bdd, not Reqnroll — see
      # ADR-0053/ADR-0073 and the matching filter on the `test` job's
      # `dotnet test` step. Skipped scenarios would not move coverage either
      # way; the filter keeps the two runs collecting the same set.
      # No explicit trx filename: dotnet test runs one vstest host per project,
      # and a shared filename would make each one overwrite the last. Without
      # one, each host gets a unique name and tools/test-count.mjs reads the
      # project name back out of the trx's own `storage` attribute.
      - name: Collect .NET coverage
        run: >
          dotnet test HpacSafety.slnx
          --configuration Release
          --filter "Category!=ui"
          --collect:"XPlat Code Coverage"
          --settings coverlet.runsettings
          --logger trx
          --results-directory ./artifacts/coverage

      - name: Collect JavaScript coverage
        run: |
          suite=$(find tests/js -name '*.test.mjs' -o -name '*.test.js' 2>/dev/null)
          if [ -n "$suite" ]; then
            mkdir -p ./artifacts/coverage/js
            # shellcheck disable=SC2086
            node --test --experimental-test-coverage \
              --test-reporter=lcov --test-reporter-destination=./artifacts/coverage/js/lcov.info \
              $suite
          else
            echo "::notice::No JavaScript test suite yet - added by #8. The merge below picks it up automatically once tests/js exists."
          fi

      # ReportGenerator merges every Cobertura and lcov file it finds into one
      # report, so the JS half needs no wiring here beyond producing lcov.
      - name: Merge into one report
        run: >
          dotnet tool run reportgenerator
          "-reports:./artifacts/coverage/**/coverage.cobertura.xml;./artifacts/coverage/**/lcov.info"
          "-targetdir:./artifacts/report"
          "-reporttypes:Cobertura;MarkdownSummaryGithub;HtmlInline"

      # The ratchet compares against main's last green run rather than
      # recomputing it, which would double this job's time and re-run the
      # Testcontainers suite for a number that is already known. See ADR-0014.
      - name: Fetch the main baseline
        id: baseline
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          run_id=$(gh run list --workflow CI --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)

          if [ -z "${run_id:-}" ]; then
            echo "::notice::No successful CI run on main yet. The ratchet will not run; the floor still applies."
            echo "path=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh run download "$run_id" --name coverage-report --dir ./artifacts/baseline 2>/dev/null \
            && [ -f ./artifacts/baseline/Cobertura.xml ]; then
            echo "Baseline from main run $run_id."
            echo "path=./artifacts/baseline/Cobertura.xml" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main run $run_id has no coverage-report artifact - it predates this job, or the artifact expired. Ratchet skipped; the floor still applies."
            echo "path=none" >> "$GITHUB_OUTPUT"
          fi

      # Output is captured to comment.md here, once, rather than re-run by the
      # comment step below - the script writes to $GITHUB_STEP_SUMMARY as a
      # side effect, and running it twice duplicated the table in the job
      # summary.
      - name: Gate
        id: gate
        run: |
          set -o pipefail
          {
            echo "<!-- coverage-gate -->"
            node tools/coverage-gate.mjs \
              --report ./artifacts/report/Cobertura.xml \
              --baseline "${{ steps.baseline.outputs.path || 'none' }}" \
              --min-line 80 --min-branch 70
          } 2>&1 | tee comment.md

      # The detailed per-file table, always, so a failure is diagnosable from
      # the run page without downloading anything.
      - name: Detail in the job summary
        if: always()
        run: |
          if [ -f ./artifacts/report/SummaryGithub.md ]; then
            {
              echo ""
              echo "<details><summary>Per-assembly detail</summary>"
              echo ""
              cat ./artifacts/report/SummaryGithub.md
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Only present when the e2e job actually ran (needs.e2e.result ==
      # 'success'); a dotnet-only PR has nothing to download here, and the
      # merge step below tolerates that with its own "not run" line.
      - name: Download the Playwright test count
        if: needs.e2e.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: test-count-e2e
          path: ./artifacts/test-count

      # Appended to comment.md (already written by the Gate step above)
      # rather than a separate comment, per #263 - one table pair, not two
      # comments to scroll past.
      - name: Add test counts
        run: |
          {
            echo ""
            echo "## Test counts"
            echo ""
            node tools/test-count.mjs --section csharp --trx-dir ./artifacts/coverage
            if [ -f ./artifacts/test-count/e2e.md ]; then
              cat ./artifacts/test-count/e2e.md
            else
              echo "_Playwright suite not run in this job._"
            fi
          } >> comment.md

      # Skipped on fork pull requests, whose token cannot write. The job summary
      # above carries the same information, so nothing is lost - a failing gate
      # is still fully diagnosable from the run page.
      - name: Comment on the pull request
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # comment.md was written by the Gate step above.
          # --edit-last keeps one comment that updates, rather than a new one on
          # every push. --create-if-none covers the first run on a pull request.
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file comment.md --edit-last --create-if-none

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: |
            ./artifacts/report/Cobertura.xml
            ./artifacts/report/SummaryGithub.md
            ./artifacts/report/*.html
          if-no-files-found: warn

  # Vite + @tailwindcss/vite, one package.json, one committed lockfile. See
  # ADR-0043 (supersedes ADR-0006's no-Node standalone-CLI build).
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: npm ci
        run: npm --prefix src/web ci

      - name: Build
        run: npm --prefix src/web run build

      - name: The bundle was produced
        run: test -s src/web/dist/index.html

      # The acceptance criterion from #11, checked rather than trusted: nothing
      # in the built bundle reaches Google for a font. The @font-face URLs in
      # src/web/src/index.css are relative paths into src/web/assets/fonts.
      - name: No third-party font requests
        run: |
          set -eu
          hits=$(grep -rIl -e fonts.googleapis.com -e fonts.gstatic.com \
            src/web/dist || true)
          if [ -n "$hits" ]; then
            echo "::error::Fonts must be self-hosted from src/web/assets/fonts. Found a Google Fonts reference in:"
            echo "$hits"
            exit 1
          fi

      # Raw hex in markup defeats the token system: a literal colour cannot be
      # re-themed, so it is the one thing that stays light when everything
      # around it goes dark. Hex values belong in src/web/src/index.css, which
      # is why only source markup/components are scanned here, not that file
      # itself. See ADR-0024.
      #
      # CSS hex colours come in four valid lengths - #rgb, #rgba, #rrggbb,
      # #rrggbbaa - and Tailwind arbitrary values (bg-[#f22312ff]) use the
      # 4- and 8-digit alpha forms routinely. The alternation below is
      # ordered longest-first so grep reports the whole literal rather than a
      # 6-digit prefix of an 8-digit one; POSIX ERE alternation is
      # leftmost-longest at each position regardless of order, but the order
      # keeps the intent readable.
      #
      # Known false positive, left as-is rather than fixed: a hex-shaped
      # anchor fragment - href="#bad", href="#dead" - matches the 3/4-digit
      # branch. Distinguishing "#bad" the fragment from "#bad" the colour
      # needs the surrounding attribute context (href=, id=, a CSS
      # declaration, a Tailwind bracket), which turns a one-line content lint
      # into a small parser for one rare collision - a fragment id that also
      # happens to be a valid hex string. Cheaper to rename the anchor than to
      # carry that complexity in a grep gate.
      - name: No raw hex in markup
        run: |
          set -eu
          hits=$(grep -rInE '#[0-9a-fA-F]{8}\b|#[0-9a-fA-F]{6}\b|#[0-9a-fA-F]{4}\b|#[0-9a-fA-F]{3}\b' \
            src/web/src src/web/index.html src/web/theme-preview.html \
            --include='*.tsx' --include='*.ts' --include='*.html' || true)
          if [ -n "$hits" ]; then
            echo "::error::Raw hex values belong in src/web/src/index.css. Use the @theme tokens in markup:"
            echo "$hits"
            exit 1
          fi

      # dist/ is generated and gitignored. If a build produces a tracked
      # change, something that should be generated has been committed.
      - name: No drift from building
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Building the app modified tracked files:"
            git status --porcelain
            exit 1
          fi

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: npm ci
        run: npm --prefix tests/e2e ci

      # The webServer in playwright.config.ts installs and builds src/web
      # itself before tests run.
      - name: Install browsers
        run: npx --prefix tests/e2e playwright install --with-deps chromium

      - name: Playwright
        run: npm --prefix tests/e2e test

      # npm test above already ran bddgen, so .features-gen reflects exactly
      # what this job just executed. The `coverage` job depends on this job
      # (see ci.yml's coverage job) and downloads this fragment rather than
      # regenerating it — only this job has actually run Playwright. See #263.
      - name: Count Playwright tests
        if: always()
        run: |
          mkdir -p ./artifacts/test-count
          node tools/test-count.mjs --section e2e > ./artifacts/test-count/e2e.md

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-count-e2e
          path: ./artifacts/test-count/e2e.md
          if-no-files-found: warn

  agent-config:
    runs-on: ubuntu-latest
    steps:
      # Symlinks only survive checkout when core.symlinks is on; it is by
      # default on Linux runners. If that ever changes this job is what notices.
      - uses: actions/checkout@v7

      - name: Agent instruction symlinks resolve to AGENTS.md
        run: |
          set -euo pipefail
          canonical=$(readlink -f AGENTS.md)
          fail=0
          for link in CLAUDE.md .github/copilot-instructions.md .cursor/rules/agents.mdc; do
            if [ ! -L "$link" ]; then
              echo "::error file=$link::Not a symlink. It must point at AGENTS.md."
              fail=1
              continue
            fi
            target=$(readlink -f "$link" || true)
            if [ "$target" != "$canonical" ]; then
              echo "::error file=$link::Resolves to '${target:-<broken>}', expected '$canonical'."
              fail=1
            fi
          done
          exit $fail

      - name: Install skillfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.9.1 \
            --repo eljulians/skillfile \
            --pattern skillfile-x86_64-linux \
            --output "$RUNNER_TEMP/skillfile"
          chmod +x "$RUNNER_TEMP/skillfile"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Skillfile validates and installs from the lock
        run: |
          set -euo pipefail
          skillfile validate
          skillfile install
          skillfile status

      # The deploy workflows never run on a pull request - by design, they
      # trigger on a push to main. So nothing exercises a local action they
      # depend on until it is already merged, and a manifest error surfaces on
      # main or not at all. That is how #36 got in. Loading the action here
      # parses its manifest on every pull request.
      - name: Local composite actions load
        uses: ./.github/actions/require-config
        with:
          secrets: |
            EXERCISE_SECRET=present
          variables: |
            EXERCISE_VARIABLE=present
          context: 'This is a CI self-test of the action, not a real deploy.'

      # .claude/skills and .claude/agents are gitignored. If `skillfile install`
      # ever starts writing tracked files, that is drift worth failing on.
      - name: No drift from installing skills
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::skillfile install modified tracked files:"
            git status --porcelain
            exit 1
          fi

  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Locale key parity
        run: |
          if [ ! -f locales/en-CA.json ]; then
            echo "::notice::No locale files yet — added by #7. Skipping."
            exit 0
          fi
          if [ ! -f tools/check-locales.mjs ]; then
            echo "::error::locales/en-CA.json exists but tools/check-locales.mjs does not. See #8."
            exit 1
          fi
          node tools/check-locales.mjs

      - name: No hardcoded user-facing strings
        run: |
          if [ ! -f tools/check-hardcoded-strings.mjs ]; then
            echo "::notice::Hardcoded-string lint not written yet — added by #8. Skipping."
            exit 0
          fi
          node tools/check-hardcoded-strings.mjs

      # VERIFY ONLY. --check reads the three locale files and constructs no
      # translator, so no inference happens here and no locale file is written.
      # That is not a detail: this workflow runs fork-authored code on
      # `pull_request` with a read-only token, and untrusted code must never be
      # able to trigger a model call or edit generated French. Generation lives
      # in i18n-translate.yml, which runs only on a push to main. See ADR-0021.
      #
      # No provider configuration is passed into this step, on purpose. There is
      # nothing here for it to use.
      - name: Locale translation is in step with English
        run: node tools/translate-locale.mjs --check --locales locales
