name: Relock Terraform providers

# Runs infra/relock-providers.sh on a schedule and opens a pull request when the
# pinned provider version moves. Renovate's terraform manager does this by
# computing lock file checksums itself instead of running terraform, and once
# produced a checksum that did not match the registry's real package (#118).
# renovate.json disables lockFileMaintenance for the terraform manager for that
# reason; this workflow replaces it with the real terraform binary, so the
# checksums it commits are exactly what `terraform init` will verify.
#
# Same shape as i18n-translate.yml: runs only on a schedule/dispatch, never on
# a pull_request (so a fork cannot make this repository open pull requests),
# and opens a PR rather than pushing to main directly.

on:
  schedule:
    # Matches Renovate's former lockFileMaintenance cadence: early Monday,
    # off the hour to avoid the shared top-of-hour scheduler spike.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-relock
  cancel-in-progress: false

env:
  RELOCK_BRANCH: chore/terraform-provider-relock

jobs:
  relock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # A persisted GITHUB_TOKEN header outranks the PAT the push step puts
          # on the remote URL, so CI would not run as the PAT (lesson 0018).
          persist-credentials: false

      # Version comes out of infra/.terraform-version, never restated here —
      # see ADR-0015 and terraform.yml's infra job, which installs the same way.
      - name: Install the pinned Terraform
        run: |
          set -euo pipefail
          tf_version=$(tr -d '[:space:]' < infra/.terraform-version)
          curl -fsSL -o /tmp/terraform.zip \
            "https://releases.hashicorp.com/terraform/${tf_version}/terraform_${tf_version}_linux_amd64.zip"
          unzip -q -o /tmp/terraform.zip -d /usr/local/bin
          chmod +x /usr/local/bin/terraform
          terraform version

      - name: Relock providers
        run: ./infra/relock-providers.sh

      - name: Check for a change
        id: diff
        run: |
          if git diff --quiet -- infra/.terraform.lock.hcl; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Reuses the same fine-grained repository PAT i18n-translate.yml uses to
      # open its pull request — the built-in GITHUB_TOKEN cannot trigger CI on a
      # pull request it opens (GitHub's loop protection), and infra is now a
      # required check, so a PR opened without it would sit unable to merge
      # until someone nudges it by hand. See ADR-0021.
      - name: Open a pull request with the relocked provider
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.TRANSLATION_PR_TOKEN || github.token }}
          USING_DEFAULT_TOKEN: ${{ secrets.TRANSLATION_PR_TOKEN == '' }}
        run: |
          set -euo pipefail

          if [ "$USING_DEFAULT_TOKEN" = 'true' ]; then
            echo "::warning::No TRANSLATION_PR_TOKEN is set, so this pull request is opened with the built-in GITHUB_TOKEN and CI will not run on it. Close and reopen it, or push an empty commit, before merging."
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git switch -C "$RELOCK_BRANCH"
          git add infra/.terraform.lock.hcl
          git commit -m 'Relock Terraform providers'

          # Force, because the branch is rebuilt from main every run.
          git push --force origin "$RELOCK_BRANCH"

          BODY='Regenerated by `.github/workflows/terraform-relock.yml` with the real `terraform providers lock`, not Renovate. See `infra/README.md` and issue #118.'

          if gh pr view "$RELOCK_BRANCH" --json number --jq .number >/dev/null 2>&1; then
            gh pr edit "$RELOCK_BRANCH" --body "$BODY"
            echo 'Updated the open relock pull request.'
          else
            gh pr create \
              --base main \
              --head "$RELOCK_BRANCH" \
              --title 'Relock Terraform providers' \
              --body "$BODY"
          fi
