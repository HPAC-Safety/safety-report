name: CI

# Public repository. Fork pull requests run here, so this workflow uses
# `pull_request` and NEVER `pull_request_target` — the latter would run
# fork-authored code with a write token and repository secrets in scope.
#
# No job below reads a secret. Anything that needs one (the Gemini client,
# for instance) runs against recorded fixtures instead. Keep it that way.
#
# merge_group: the merge queue tests each queued pull request on top of main
# and the pull requests ahead of it, on a gh-readonly-queue/main/* branch, and
# waits for every required context there (ADR-0147). Every job below runs on
# it exactly as on a pull request; only the pull request comment is skipped.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only a newer push to the same pull request cancels a run, and that newer
# run reports every context again: each job is always scheduled (see
# `changes`). A merge group's ref is its own gh-readonly-queue/main/* branch,
# so queue runs never share a group and never cancel each other (ADR-0147).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Job ids are the status-check contexts named in docs/github-ruleset.json.
  # Renaming a job renames the context and silently drops it from the required
  # set — the ruleset keeps waiting on a name nothing reports. Moving a job to
  # another workflow file keeps its context, which is how `feature-coverage`
  # and `linked-issue` live in their own files while staying required.
  #
  # tools/dev/ci-local.sh runs only the cheap jobs by default: build, web, i18n,
  # docs, cucumber, agent-config (with the linked-issue and feature-coverage
  # workflows). test, coverage, and e2e run under act only with --full; GitHub
  # CI, here, is the full gate (ADR-0145, amended for #687). A new job is
  # cheap or not: add it to FAST_CI_JOBS in that script if it is.

  # NOT a `paths:` filter on the trigger above — that is the trap ADR-0011 and
  # terraform.yml document: a required context whose *workflow* never runs
  # never reports, and blocks every pull request permanently. This job-level
  # `if:` is different in kind, not just detail: the workflow above still
  # triggers unconditionally, so `changes` always runs and every job below
  # always gets scheduled; it just completes as "skipped" rather than running
  # its real steps when the paths it cares about did not change. GitHub treats
  # a skipped job as passing for required-status-check purposes. See ADR-0039.
  #
  # On merge_group the filter diffs the event's merge_group.base_sha against
  # its head_sha with git (paths-filter's own merge_group support): every pull
  # request in the group, and those ahead of it, on top of main. If the filter
  # cannot decide, every gated job runs, because a job skipped by a filter
  # that broke is a check that silently passed (ADR-0147):
  # - the filter step fails: continue-on-error, and every output is 'true';
  # - the whole job fails (checkout, runner): each gated job's `if:` runs it
  #   when needs.changes.result is not 'success'. `!cancelled()` is what lets
  #   it run at all after a failed need.
  changes:
    runs-on: ubuntu-latest
    outputs:
      dotnet: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.dotnet || 'true' }}
      web: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.web || 'true' }}
      e2e: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.e2e || 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        continue-on-error: true
        with:
          # Under act (tools/dev/ci-local.sh) no pull request exists for the API to
          # list, so an empty token makes the filter diff the event's base SHA
          # with git instead. On GitHub env.ACT is empty and this is the
          # action's own default, github.token. ADR-0145.
          token: ${{ !env.ACT && github.token || '' }}
          filters: |
            dotnet:
              - 'src/**'
              - 'tests/**'
              - 'global.json'
              - 'HpacSafety.slnx'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'coverlet.runsettings'
              - 'init-dev.sh'
              - 'tools/dev/ci-local.sh'
              - 'tools/build/build-worker-image.sh'
              - 'tools/build/smoke-test-worker-image.ts'
              - 'tools/build/check-clean-worktree.ts'
              - 'tools/coverage/**'
              - 'tools/lib/actions.ts'
              - '.github/workflows/ci.yml'
              # A scenario changed with no code still has to pass its engine's
              # run, and the claim gate in `coverage` judges it (ADR-0195).
              - '.spec/features/**/*.feature'
              - 'tools/spec/check-claim-results.ts'
            # The web bundle loads its catalogues from locales/ at the repository
            # root, so a copy change is a web change (lesson 0020).
            web:
              - 'src/web/**'
              - 'locales/**'
              - 'tools/web/check-no-third-party-fonts.ts'
              - 'tools/web/check-raw-hex.ts'
              - 'tools/build/check-clean-worktree.ts'
              - 'tools/lib/actions.ts'
              - '.github/workflows/ci.yml'
            e2e:
              - 'src/web/**'
              - 'locales/**'
              - 'tests/e2e/**'
              - '.github/workflows/ci.yml'
              - '.spec/features/**/*.feature'

  build:
    needs: changes
    if: "!cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.dotnet == 'true')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 24 runs the .ts scripts under tools/ by type stripping (ADR-0189); the runner's preinstalled Node is older.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Preinstalled on the runner. init-dev.sh is POSIX sh, not bash: Windows
      # contributors run it under Git Bash, so a bashism would break the one
      # platform nobody here tests on by hand. See ADR-0015.
      # The hook is POSIX sh for the same reason, and it grew real branching
      # when its two checks were made independent (#207) — a bashism or an
      # unguarded cd there breaks committing, not CI, so it is worth linting.
      # tools/dev/ci-local.sh is POSIX sh too (ADR-0145): it is the pre-pull-request
      # gate, so a bashism there stops every pull request before it opens.
      - name: shellcheck init-dev.sh, the pre-commit hook, and ci-local.sh
        run: shellcheck -s sh init-dev.sh .githooks/pre-commit tools/dev/ci-local.sh

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore HpacSafety.slnx
      - run: dotnet format HpacSafety.slnx --verify-no-changes --no-restore
      # Directory.Build.props sets TreatWarningsAsErrors, so a warning already
      # fails. --warnaserror is belt and braces for anything outside that scope.
      - run: dotnet build HpacSafety.slnx --configuration Release --no-restore --warnaserror

      # The Worker image is the one deployed (ADR-0118), built by the same script
      # dev-up.sh and deploy-worker.yml use. What is proven here is that ffmpeg
      # and ffprobe are on the image's PATH, where FfmpegVideoRemuxer looks, and
      # that the Worker runs unprivileged. The remux itself is proven by
      # FfmpegVideoRemuxerTests against the runner's Ubuntu ffmpeg, the same
      # archive the image installs from.
      - name: shellcheck the Worker image build
        run: shellcheck tools/build/build-worker-image.sh
      - name: Build the Worker image and prove ffmpeg runs inside it
        run: node tools/build/smoke-test-worker-image.ts hpacsafety-worker:ci

  # The one job that runs the .NET and JavaScript suites. It collects coverage
  # as it runs them and hands the raw reports to `coverage`, which gates them
  # without running a test (#694). So it runs whenever `coverage` needs a
  # report: on a .NET change, and on an e2e-only change too, whose coverage
  # comment carries the Playwright count.
  test:
    needs: changes
    if: "!cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.dotnet == 'true' || needs.changes.outputs.e2e == 'true')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Exercises the version parsing on every pull request. setup-dotnet and
      # setup-node above have already satisfied the versions init-dev.sh reads
      # out of global.json and this file, so a failure here means the script
      # stopped agreeing with the files that pin them - which is exactly the
      # drift ADR-0015 exists to prevent. --check installs nothing.
      - name: init-dev.sh --check
        run: ./init-dev.sh --check

      # @ui-tagged scenarios execute via playwright-bdd (tests/e2e), not
      # Reqnroll — see ADR-0053. The acceptance suite skips them itself, by a
      # hook that throws xUnit's SkipException, which skips cleanly with the
      # Cucumber Messages formatter below on or off, so a bare `dotnet test`
      # is already correct (ADR-0073, ADR-0195); this filter is a
      # second line of defence, keeping the job green even if that hook
      # regresses. Reqnroll's xUnit generator emits a `[Trait("Category", tag)]`
      # per Gherkin tag, which is what this filters on. UiScenarioHooksTests is
      # what actually catches a removed hook, since this filter would hide it.
      # Video derivatives are produced by remuxing through ffmpeg (ADR-0094).
      # Installed explicitly rather than relying on the runner image happening
      # to carry it: FfmpegVideoRemuxerTests generates its fixtures with it and
      # would otherwise fail for a reason that has nothing to do with the change
      # under test.
      - name: Update the package index
        run: sudo apt-get update

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      # coverlet.runsettings excludes generated code. Without it the API reports
      # 4.8% while Program.cs is at 100%, because the OpenApi source generator
      # emits ~440 lines into obj/ that no test will ever run.
      # No explicit trx filename: dotnet test runs one vstest host per project,
      # and a shared filename would make each one overwrite the last. Without
      # one, each host gets a unique name and tools/coverage/report-test-counts.ts reads the
      # project name back out of the trx's own `storage` attribute.
      # REQNROLL_FORMATTERS turns on Reqnroll's Cucumber Messages formatter:
      # every scenario it runs, keyed by its claim tag, for the claim gate in
      # `coverage` (ADR-0195). The path is absolute because each test host
      # runs in its own output directory.
      - name: dotnet test
        env:
          REQNROLL_FORMATTERS: '{"formatters":{"message":{"outputFilePath":"${{ github.workspace }}/artifacts/claims/reqnroll.ndjson"}}}'
        run: |
          dotnet test HpacSafety.slnx \
            --configuration Release \
            --filter "Category!=ui" \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings \
            --logger trx \
            --results-directory ./artifacts/coverage

      # The script passes the suite as an explicit file list, and writes the
      # lcov to ./artifacts/coverage/js/lcov.info for `coverage` to merge.
      - name: node --test
        run: node tools/coverage/run-js-tests.ts

      # The web logic's unit tests, for their lcov. vite.config.ts writes it to
      # artifacts/coverage/web/lcov.info, where the ReportGenerator glob in
      # `coverage` finds it with the .NET and tools/ reports, so the ratchet
      # counts it (ADR-0188). The `web` job runs the same command as its gate;
      # this run is the one whose report is merged.
      - name: Install the web dependencies
        run: npm --prefix src/web ci

      - name: Web unit tests
        run: npm --prefix src/web run test:coverage

      # The raw reports, the trx files included, for `coverage` to merge and
      # gate. Only this run reads them, so a day's retention is enough.
      # Temporary: act's artifact server rejects upload-artifact@v7
      # (nektos/act#6022), so under act the next step hands them over through
      # the per-run directory tools/dev/ci-local.sh mounts. Remove `&& !env.ACT`
      # and that step when act ships the fix. ADR-0145.
      - uses: actions/upload-artifact@v7
        if: "!env.ACT"
        with:
          name: coverage-raw
          path: ./artifacts/coverage
          retention-days: 1
          if-no-files-found: error

      - name: Hand the raw reports to coverage under act
        if: env.ACT
        run: node tools/coverage/hand-over-raw-reports.ts push

      # The Reqnroll claim results, for the claim gate in `coverage`. Uploaded
      # even when a test failed, so the failing claims can be read from it.
      # Never committed: a run's results are not the specification (ADR-0195).
      # Temporary under act, as above (nektos/act#6022).
      - uses: actions/upload-artifact@v7
        if: "!cancelled() && !env.ACT"
        with:
          name: claim-results-reqnroll
          path: ./artifacts/claims/reqnroll.ndjson
          retention-days: 7
          if-no-files-found: error

      - name: Hand the Reqnroll claim results to coverage under act
        if: "!cancelled() && env.ACT"
        run: node tools/coverage/hand-over-raw-reports.ts push claims

  # Parses every .spec/features/**/*.feature file with the official @cucumber/gherkin
  # parser (the same parser cucumber-js uses), pinned in
  # tools/gherkin/package.json. Syntax only — these are specification
  # documents, not an executable suite, so there are no step definitions to run
  # them against. See .spec/features/README.md.
  cucumber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install the Gherkin parser
        run: npm --prefix tools/gherkin ci

      - name: Gherkin feature files parse
        run: node tools/gherkin/verify.ts

  # Every tracked markdown file declares its title, description, and type
  # (ADR-0087). The Worker's runtime prompts are exempt - their bytes are the
  # model payload - and the validator names that exemption itself. The
  # pre-commit hook runs the same check over staged markdown, so this is the
  # backstop for a commit made without it, not the only place the rule lives.
  docs:
    runs-on: ubuntu-latest
    steps:
      # The whole history, so the ADR immutability check can read the base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Every markdown file declares what it is
        run: node tools/docs/check-frontmatter.ts

      # Nothing else notices a link a move or a rename broke: GitHub renders it
      # as a 404 and the build stays green. ADR-0183.
      - name: Every relative link resolves
        run: node tools/docs/check-links.ts

      # The generic skills and role agents are reused elsewhere, so they name
      # nothing specific to this repository. ADR-0131.
      - name: Generic agent instructions name nothing specific to this repository
        run: node tools/docs/check-generic-instructions.ts

      # A workflow step runs one command; its logic is a tested script under
      # tools/. ADR-0189.
      - name: Workflow steps run one command
        run: node tools/github/check-workflow-steps.ts

      # An ADR's number is its identity and is claimed by naming a file, so two
      # branches can claim the same one and only a rebase notices. ADR-0091.
      - name: Decision records are numbered without collision
        run: node tools/spec/adr-numbers.ts

      # Every ADR keeps one status line and its considered options, a new one
      # follows TEMPLATE.md, every lesson declares a kind and owes what that
      # kind owes, and every convention keeps its shape. ADR-0192.
      - name: Decision records, lessons, and conventions keep their shape
        run: node tools/spec/check-records.ts

      # An accepted ADR is immutable: a pull request or merge group may change
      # only its status, never delete it. A push to main has no base and was
      # checked on its pull request. ADR-0192.
      - name: An accepted ADR changes only its status
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node tools/spec/check-adr-immutability.ts

      # The source inventory is kept at directory level, so a new directory
      # under src/ needs a row and a removed one loses its row. ADR-0143.
      - name: The source inventory lists every directory under src/
        run: node tools/docs/check-inventories.ts

      # A workflow that reads `terraform output NAME` (or a deploy_variables /
      # site_urls key) is trusting infra/outputs.tf to still declare it -
      # nothing else catches a renamed or removed output before a release
      # actually runs against AWS. #466.
      - name: Every workflow's terraform output reference is declared in infra/outputs.tf
        run: node tools/infra/check-terraform-outputs.ts

      # The .NET major lives in global.json, the target framework, the Worker's
      # base image, and Renovate's allowedVersions. Here, not behind the dotnet
      # path filter, because a renovate.json-only change must run it too.
      # ADR-0120.
      - name: The .NET major agrees everywhere it is declared
        run: node tools/build/check-dotnet-major.ts

      # Scenarios and area READMEs use the glossary's words: one per concept,
      # with the banned synonyms read from .spec/glossary.md's tables (#815,
      # CONV-003). No baseline: it passes only at zero.
      - name: Scenarios and area READMEs use the glossary's words
        run: node tools/spec/check-glossary.ts

      # The specification index is generated from .spec/: every area,
      # constraint page, decision, and lesson, read from its own file.
      # traceability.yml commits it with the claims. ADR-0183.
      - name: The specification index matches its files
        run: node tools/spec/generate-spec-index.ts --check

      # .spec/claims.json and the matrix are generated from the claim tags, the
      # CON ids, the step definitions, and the decisions and lessons, so a
      # scenario added without an id, a duplicate, a constraint naming a claim
      # that does not exist, or a built claim with a step no definition binds
      # fails here, and so does a committed file that no longer matches - the
      # same shape as "No drift from installing skills" and dotnet format
      # --verify-no-changes (ADR-0084, ADR-0184, ADR-0193). On a pull request
      # it is the backstop, not the fixer: traceability.yml regenerates both
      # onto a same-repo PR's branch, so this fails only for a fork or a changed
      # generator (ADR-0101). On a merge group it is the gate: when two queued
      # pull requests both change the specification, the second one's files
      # are stale on the merged tree, so it fails here and leaves the queue to
      # be rebased (ADR-0147).
      - name: The claims and the matrix match the specification
        run: node tools/spec/generate-traceability.ts --check

      # feature-coverage judges a pull request's scenarios and cited claims by
      # the feature areas its changed files map to, so every behavior-bearing
      # file must map to one, every glob must still match a file, and every
      # area must exist (CONV-001).
      - name: Every behavior-bearing file belongs to a feature area
        run: node tools/spec/check-area-paths.ts

  coverage:
    # Runs no test: `test` ran the suites once, collecting coverage, and this
    # merges and gates the reports it handed over (#694). It also holds the
    # claim gate: every built claim of an engine that ran passed (ADR-0195). Depends on e2e (not
    # just changes) so it can download that job's Playwright test count
    # instead of reinstalling Playwright itself — see the "Count Playwright
    # tests" step on the e2e job and #263. e2e is itself conditional, so
    # `always()` plus the explicit result checks is needed: a plain
    # `needs: e2e` would skip this job whenever e2e does. `test` runs on every
    # change this job gates, so its success stands in for the path check. A
    # failing `test` skips this job: there is no whole report to gate, and
    # `test` failing already holds the pull request.
    needs: [changes, test, e2e]
    if: >-
      always() &&
      needs.test.result == 'success' &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reading this run's coverage-raw and the baseline artifact from main's
      # last green run.
      actions: read
      # Posting the summary comment. Fork pull requests get a read-only token,
      # so the comment step is skipped for them - see the step's condition.
      pull-requests: write
    steps:
      # This job reads reports written by the repository's tests, with a token
      # that can write pull request comments. On pull_request a fork's token is
      # read-only, but a merge group runs in this repository's own context
      # whoever wrote the queued code: a maintainer's review and queuing is the
      # trust boundary there (ADR-0147). So the token is never persisted into
      # .git/config; only the steps that need it get it, as GH_TOKEN.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Restore tools
        run: dotnet tool restore

      # The per-project Cobertura attachments, trx files, and JavaScript lcov
      # `test` collected, at the paths it wrote them.
      # Temporary: act's artifact server rejects download-artifact@v8
      # (nektos/act#6022), so under act the next step reads them from the
      # per-run directory tools/dev/ci-local.sh mounts. Remove `&& !env.ACT` and
      # that step when act ships the fix. ADR-0145.
      - name: Download the raw reports
        if: "!env.ACT"
        uses: actions/download-artifact@v8
        with:
          name: coverage-raw
          path: ./artifacts/coverage

      - name: The raw reports under act
        if: env.ACT
        run: node tools/coverage/hand-over-raw-reports.ts pull

      # The claim results `test` and `e2e` wrote, for the claim gate below.
      # Temporary under act, as above (nektos/act#6022).
      - name: Download the Reqnroll claim results
        if: "!env.ACT"
        uses: actions/download-artifact@v8
        with:
          name: claim-results-reqnroll
          path: ./artifacts/claims

      - name: Download the playwright-bdd claim results
        if: needs.e2e.result == 'success' && !env.ACT
        uses: actions/download-artifact@v8
        with:
          name: claim-results-playwright-bdd
          path: ./artifacts/claims

      - name: The claim results under act
        if: env.ACT
        run: node tools/coverage/hand-over-raw-reports.ts pull claims

      # ReportGenerator merges every Cobertura and lcov file it finds into one
      # report, so the JS half needs no wiring here beyond producing lcov.
      # Only the attachment copies, one per test project in a GUID directory
      # directly under the results directory, are read. vstest also copies each
      # report into a per-run <machine>_<timestamp>/In/ directory named to the
      # second; two projects finishing in the same second share it, and the
      # second copy is renamed coverage.cobertura[1].xml, which no glob matched.
      # The count read then varied between 11 and 12 with identical coverage,
      # because every In/ copy duplicates an attachment (#546).
      - name: Merge into one report
        run: |
          dotnet tool run reportgenerator \
            "-reports:./artifacts/coverage/*/coverage.cobertura.xml;./artifacts/coverage/**/lcov.info" \
            "-targetdir:./artifacts/report" \
            "-reporttypes:Cobertura;MarkdownSummaryGithub;HtmlInline"

      # The ratchet compares against main's last green run (ADR-0014, ADR-0147,
      # ADR-0165); the script says how it picks it. tools/dev/ci-local.sh calls
      # the same finder, so both pick the same run.
      - name: Fetch the main baseline
        id: baseline
        if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !env.ACT
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/coverage/fetch-coverage-baseline.ts

      # Under act (tools/dev/ci-local.sh) the job has no token, and GitHub answers an
      # anonymous artifact download with 401 even on a public repository. So the
      # wrapper downloads the same run's coverage-report on the host, with the
      # developer's gh login, into the gitignored .ci-local/baseline/, and this
      # reads it. Permanent: act never receives a token, and the wrapper fails a
      # run whose job reports holding one. ADR-0145.
      - name: The main baseline tools/dev/ci-local.sh fetched
        id: baseline-local
        if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && env.ACT
        env:
          JOB_TOKEN: ${{ github.token }}
        run: node tools/coverage/read-local-baseline.ts

      # The script runs the gate once and keeps its output as comment.md, so the
      # comment step below does not re-run it (that duplicated the table in the
      # job summary).
      - name: Gate
        id: gate
        env:
          BASELINE_PATH: ${{ steps.baseline.outputs.path || steps.baseline-local.outputs.path || 'none' }}
          BASELINE_RUN_ID: ${{ steps.baseline.outputs.run-id || steps.baseline-local.outputs.run-id || 'none' }}
        run: node tools/coverage/write-coverage-comment.ts --min-line 80 --min-branch 70

      # The detailed per-file table, always, so a failure is diagnosable from
      # the run page without downloading anything.
      - name: Detail in the job summary
        if: always()
        run: node tools/coverage/report-coverage-detail.ts

      # A built claim counts only when its scenario passed in this run
      # (ADR-0195). Reqnroll is judged whenever this job runs, because `test`
      # did; playwright-bdd only when `e2e` ran, since its path filter skipped
      # it otherwise. A built claim of a judged engine that failed, was
      # skipped, or never ran fails here, and the job summary lists every
      # claim's result. After the coverage gate, and whatever it decided, so
      # one run reports both verdicts.
      - name: Every built claim passed in its engine's run
        if: "!cancelled()"
        env:
          REQNROLL_RESULTS: ./artifacts/claims/reqnroll.ndjson
          PLAYWRIGHT_BDD_RESULTS: ${{ needs.e2e.result == 'success' && './artifacts/claims/playwright-bdd.ndjson' || '' }}
        run: node tools/spec/check-claim-results.ts --out ./artifacts/claims/claim-results.json

      # Each claim's result in this run, as data. Never committed (ADR-0195).
      # Temporary: skips under act (nektos/act#6022).
      - uses: actions/upload-artifact@v7
        if: "!cancelled() && !env.ACT"
        with:
          name: claim-results
          path: ./artifacts/claims/claim-results.json
          retention-days: 7
          if-no-files-found: warn

      # Only present when the e2e job actually ran (needs.e2e.result ==
      # 'success'); a dotnet-only PR has nothing to download here, and the
      # merge step below tolerates that with its own "not run" line.
      # Temporary: act's artifact server rejects download-artifact@v8
      # (nektos/act#6022), so this skips under act. Remove `&& !env.ACT` when
      # act ships the fix. ADR-0145.
      - name: Download the Playwright test count
        if: needs.e2e.result == 'success' && !env.ACT
        uses: actions/download-artifact@v8
        with:
          name: test-count-e2e
          path: ./artifacts/test-count

      # Appended to comment.md (already written by the Gate step above)
      # rather than a separate comment, per #263 - one table pair, not two
      # comments to scroll past.
      - name: Add test counts
        run: node tools/coverage/append-test-counts.ts

      # Skipped on fork pull requests, whose token cannot write, and on a merge
      # group, which has no pull request to comment on. The job summary above
      # carries the same information, so nothing is lost - a failing gate is
      # still fully diagnosable from the run page.
      - name: Comment on the pull request
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # comment.md was written by the Gate step above.
          # --edit-last keeps one comment that updates, rather than a new one on
          # every push. --create-if-none covers the first run on a pull request.
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file comment.md --edit-last --create-if-none

      # Temporary: act keeps no job summary, and its artifact server rejects
      # upload-artifact@v7 (nektos/act#6022), so a local run prints the gate,
      # the test counts, the per-assembly detail, and the report's totals to
      # the log, where tools/dev/ci-local.sh finds them. Remove this step when act
      # ships the fix. ADR-0145.
      - name: Coverage for tools/dev/ci-local.sh
        if: always() && env.ACT
        run: node tools/coverage/print-ci-local-coverage.ts

      # Temporary: skips under act (nektos/act#6022). Remove `&& !env.ACT` when
      # act ships the fix. ADR-0145.
      - uses: actions/upload-artifact@v7
        if: always() && !env.ACT
        with:
          name: coverage-report
          path: |
            ./artifacts/report/Cobertura.xml
            ./artifacts/report/SummaryGithub.md
            ./artifacts/report/*.html
          if-no-files-found: warn

  # Vite + @tailwindcss/vite, one package.json, one committed lockfile. See
  # ADR-0043 (supersedes ADR-0006's no-Node standalone-CLI build).
  # ESLint over every TypeScript and JavaScript file: src/web, tools, tests/js and
  # tests/e2e (ADR-0188). It has no path filter: a change to any of them, or to
  # the root package.json or eslint.config.mjs, must be linted, and it costs
  # seconds. The rules are typescript-eslint's strict-type-checked, so the web
  # app's and the browser suite's packages are installed too: without React's
  # and Playwright's types every value from them would be `any`.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: npm ci
        run: npm ci

      - name: npm ci, web
        run: npm --prefix src/web ci

      - name: npm ci, browser suite
        run: npm --prefix tests/e2e ci

      # tools/gherkin/verify.ts imports the pinned Gherkin parser; without its
      # types the rules see `any` there.
      - name: npm ci, Gherkin check
        run: npm --prefix tools/gherkin ci

      - name: ESLint
        run: npm run lint

      # Node strips the types of tools/ and tests/js without checking them, so
      # this is the only place a type error there fails (ADR-0189).
      - name: Type check, tools and tests/js
        run: npm run typecheck

      # Playwright transpiles the browser suite without checking it, so a type
      # error in a step would otherwise never fail. It sits in this job because
      # the job already installs the suite's packages and runs on every change,
      # and so the fast local gate (tools/dev/ci-local.sh runs this job) reaches it.
      - name: Type check, browser suite
        run: npm run typecheck:e2e

  web:
    needs: changes
    if: "!cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: npm ci
        run: npm --prefix src/web ci

      # tsc --noEmit over src, test files included. Vite builds without
      # type-checking, so this is the only place a type error fails.
      - name: Type check
        run: npm --prefix src/web run typecheck

      # Vitest holds the logic of every split component, and every helper that
      # has a colocated test, to 100% line, branch, function and statement
      # coverage. Which files is decided by the files on disk, not a list
      # (tools/web/web-coverage-scope.ts, ADR-0188).
      - name: Unit tests and coverage
        run: npm --prefix src/web run test:coverage

      # The lcov just written is the one the `test` job hands to `coverage`.
      # This proves it lands where that merge reads and names each file from
      # the repository root, in the job the fast local gate runs, rather than
      # leaving the first proof to GitHub (#769).
      - name: Web coverage reaches the ratchet
        run: node tools/web/check-web-lcov.ts

      # A view is markup only, and no shipped file imports test code. The
      # strictness (every component split) is a constant in the script, not a
      # flag here (ADR-0073).
      - name: Component split
        run: node tools/web/check-component-split.ts

      - name: Build
        run: npm --prefix src/web run build

      - name: The bundle was produced
        run: test -s src/web/dist/index.html

      # Test code is never part of a release (ADR-0188). The import rule above
      # stops it at the source; this reads what was built.
      - name: No test code in the bundle
        run: node tools/web/check-web-bundle.ts src/web/dist

      # The acceptance criterion from #11, checked rather than trusted: nothing
      # in the built bundle reaches Google for a font. The @font-face URLs in
      # src/web/src/index.css are relative paths into src/web/assets/fonts.
      - name: No third-party font requests
        run: node tools/web/check-no-third-party-fonts.ts

      # Raw hex in markup defeats the token system: a literal colour cannot be
      # re-themed. Hex values belong in src/web/src/index.css; the script scans
      # only source markup and components. See ADR-0024.
      - name: No raw hex in markup
        run: node tools/web/check-raw-hex.ts

      # dist/ is generated and gitignored. If a build produces a tracked
      # change, something that should be generated has been committed.
      - name: No drift from building
        run: node tools/build/check-clean-worktree.ts "Building the app modified tracked files:"

  e2e:
    needs: changes
    if: "!cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.e2e == 'true')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: npm ci
        run: npm --prefix tests/e2e ci

      # The webServer in playwright.config.ts installs and builds src/web
      # itself before tests run.
      - name: Install browsers
        run: npx --prefix tests/e2e playwright install --with-deps chromium

      - name: Playwright
        run: npm --prefix tests/e2e test

      # npm test above already ran bddgen, so .features-gen reflects exactly
      # what this job just executed. The `coverage` job depends on this job
      # (see ci.yml's coverage job) and downloads this fragment rather than
      # regenerating it — only this job has actually run Playwright. See #263.
      - name: Count Playwright tests
        if: always()
        run: node tools/coverage/report-test-counts.ts --section e2e --out ./artifacts/test-count/e2e.md

      # The playwright-bdd claim results, for the claim gate in `coverage`
      # (ADR-0195); written by the cucumberReporter in playwright.config.ts.
      # Temporary under act (nektos/act#6022).
      - uses: actions/upload-artifact@v7
        if: "!cancelled() && !env.ACT"
        with:
          name: claim-results-playwright-bdd
          path: ./artifacts/claims/playwright-bdd.ndjson
          retention-days: 7
          if-no-files-found: error

      - name: Hand the playwright-bdd claim results to coverage under act
        if: "!cancelled() && env.ACT"
        run: node tools/coverage/hand-over-raw-reports.ts push claims

      # Temporary: skips under act (nektos/act#6022). Remove `&& !env.ACT` when
      # act ships the fix. ADR-0145.
      - uses: actions/upload-artifact@v7
        if: always() && !env.ACT
        with:
          name: test-count-e2e
          path: ./artifacts/test-count/e2e.md
          if-no-files-found: warn

  agent-config:
    runs-on: ubuntu-latest
    steps:
      # Symlinks only survive checkout when core.symlinks is on; it is by
      # default on Linux runners. If that ever changes this job is what notices.
      - uses: actions/checkout@v7

      # Node 24 runs the .ts scripts under tools/ by type stripping (ADR-0189); the runner's preinstalled Node is older.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Agent instruction symlinks resolve to AGENTS.md
        run: node tools/docs/check-agent-symlinks.ts

      - name: Install skillfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/dev/install-skillfile.ts

      # skillfile resolves each github-sourced entry through the GitHub API.
      # Unauthenticated, it shares the runner IP's 60-an-hour anonymous quota
      # and fails with HTTP 403 when a neighbour has spent it (#552). It reads
      # GITHUB_TOKEN, then GH_TOKEN; the job token is read-only here, and on a
      # fork pull request too, which is all public repositories need.
      - name: Skillfile validates the lock
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: skillfile validate

      - name: Skillfile installs from the lock
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: skillfile install

      - name: Skillfile reports its status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: skillfile status

      # The deploy workflows never run on a pull request - by design, they
      # trigger on a push to main. So nothing exercises a local action they
      # depend on until it is already merged, and a manifest error surfaces on
      # main or not at all. That is how #36 got in. Loading the action here
      # parses its manifest on every pull request.
      - name: Local composite actions load
        uses: ./.github/actions/require-config
        with:
          secrets: |
            EXERCISE_SECRET=present
          variables: |
            EXERCISE_VARIABLE=present
          context: 'This is a CI self-test of the action, not a real deploy.'

      # .claude/skills and .claude/agents are gitignored. If `skillfile install`
      # ever starts writing tracked files, that is drift worth failing on.
      - name: No drift from installing skills
        run: node tools/build/check-clean-worktree.ts "skillfile install modified tracked files:"

  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Locale key parity
        run: node tools/i18n/check-locales.ts

      - name: No hardcoded user-facing strings
        run: node tools/web/check-hardcoded-strings.ts

      # VERIFY ONLY. --check reads the three locale files and constructs no
      # translator, so no inference happens here and no locale file is written.
      # That is not a detail: this workflow runs fork-authored code on
      # `pull_request` with a read-only token, and untrusted code must never be
      # able to trigger a model call or edit generated French. Generation lives
      # in i18n-translate.yml, which runs only on a push to main. See ADR-0021.
      #
      # No provider configuration is passed into this step, on purpose. There is
      # nothing here for it to use.
      #
      # Under act (tools/dev/ci-local.sh) the check takes the pre-commit hook's
      # branch rule, --allow-pending-translation: French still pending as a
      # local `#` stub, or English reworded since it was translated, is a
      # notice. On GitHub i18n-translate.yml commits that French onto the
      # branch before this passes, and nothing runs it locally. ACT is unset
      # on GitHub, so the flag is never passed there (ADR-0145).
      - name: Locale translation is in step with English
        run: node tools/i18n/translate-locale.ts --check --locales locales ${ACT:+--allow-pending-translation}
