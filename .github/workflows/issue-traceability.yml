# docs/issue-traceability.md lists every open issue, generated from GitHub by
# tools/spec/generate-issue-traceability.ts (ADR-0191, superseding ADR-0143).
# Open issues change without any commit, so this never runs on a pull request
# and is not a required check: a pull request that closes an issue would leave
# the page stale the moment it merged, and filing any issue would fail every
# open pull request. Instead, tools/spec/check-issue-traceability.ts keeps one
# "Issue traceability drift" issue open while the committed page is not what the
# generator would write now, and closes it once they match. Whoever takes the
# drift issue regenerates the page in a pull request that closes it. Only an
# issue this bot wrote under that title is the drift issue.
#
# Runs only on a schedule, a push to main, or dispatch — never on a
# pull_request — so a fork cannot make this repository write issues.

on:
  schedule:
    # Daily, off the hour to avoid the shared top-of-hour scheduler spike.
    - cron: "23 6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-traceability
  cancel-in-progress: false

jobs:
  issue-traceability:
    # A dispatch can name any branch; only main's page is the one kept.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Keep the drift issue current
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/spec/check-issue-traceability.ts --sync
