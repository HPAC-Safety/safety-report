# Categories for a release's generated notes (issue #619, ADR-0168).
# release.yml's `release` job passes --generate-notes; GitHub lists every pull request
# merged since the previous release under the first category whose labels it
# carries. Labels come from this repository's set (deliver-hpac-change "File a
# new issue"), which every pull request carries from its issue.
changelog:
  categories:
    - title: Features
      labels:
        - enhancement
    - title: Bug fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Maintenance
      labels:
        - tech-debt
    - title: Dependencies
      labels:
        - dependencies
        - renovate
    - title: Other changes
      labels:
        - "*"
