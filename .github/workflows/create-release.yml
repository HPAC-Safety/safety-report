---
# Create a release in one click (issue #619, ADR-0168): Actions → Create
# release → Run workflow, on `main`.
#
# It picks the next `YYYY.MM.DD-N` tag (today in UTC, next free N — ADR-0158's
# format), creates that tag at this run's `main` commit together with a GitHub
# Release whose notes are generated from every pull request merged since the
# previous release (grouped by label, .github/release.yml), and then starts
# release.yml on the new tag, which builds once and deploys staging.
#
# Why release.yml is dispatched rather than triggered by the release: a
# release created with GITHUB_TOKEN never fires another workflow's
# `release: published`, but it may dispatch one. And `hpac-safety-staging`
# accepts deployments only from refs matching `20*` (infra/SETUP.md 2.1), so
# the deploy must run on the tag, not on `main`.
#
# Production is not touched here: promote.yml, run on the tag, after approval
# (ADR-0166).
name: Create release

on:
  workflow_dispatch:

permissions:
  # Create the tag and the release.
  contents: write
  # Dispatch release.yml.
  actions: write

concurrency:
  # Two runs at once would pick the same next tag.
  group: create-release
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create the tag and the release, then deploy it to staging
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          SERVER: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Create a release from main only (this run is on $REF). Run workflow → Use workflow from → main."
            exit 1
          fi

          # Today's releases are YYYY.MM.DD-1, -2, ...; take the next free N.
          day=$(date -u +%Y.%m.%d)
          last=$(gh api "repos/$REPO/git/matching-refs/tags/$day-" --jq '.[].ref' \
            | sed -n "s|^refs/tags/$day-\([1-9][0-9]*\)$|\1|p" | sort -n | tail -n 1)
          tag="$day-$(( ${last:-0} + 1 ))"

          notes=$(mktemp)
          {
            echo "## Provenance"
            echo ""
            echo "| Commit | Created by |"
            echo "|---|---|"
            echo "| [\`$SHA\`]($SERVER/$REPO/commit/$SHA) | [run $RUN_ID]($SERVER/$REPO/actions/runs/$RUN_ID) |"
            echo ""
            echo "Deploys to staging on creation. Promote to production: Actions → Promote → Use workflow from → Tags → \`$tag\`."
            echo ""
          } > "$notes"

          # --generate-notes appends every pull request merged since the
          # previous release, grouped by .github/release.yml.
          gh release create "$tag" --repo "$REPO" --target "$SHA" \
            --title "$tag" --notes-file "$notes" --generate-notes

          gh workflow run release.yml --repo "$REPO" --ref "$tag" -f tag="$tag"

          {
            echo "### Created release $tag"
            echo "- Release: $SERVER/$REPO/releases/tag/$tag"
            echo "- Staging deploy: $SERVER/$REPO/actions/workflows/release.yml (run \"Release $tag\")"
          } >> "$GITHUB_STEP_SUMMARY"
