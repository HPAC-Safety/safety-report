name: Linked issue

# The pull-request body checks, one job each:
#
# - linked-issue: the body closes an issue;
# - no-session-link: the body carries no agent session link (ADR-0107);
# - screenshots: a rendered web change links its screenshots, or says why it
#   needs none (ADR-0142).
#
# Nothing in GitHub's settings can force a pull request to close its issue. The
# only mechanism is a closing keyword in the pull request body, which becomes the
# squash commit message because the repository is configured with
# squash_merge_commit_message=PR_BODY. So the body is what gets enforced.
#
# This lives in its own workflow rather than in ci.yml so it can subscribe to
# `edited`. Fixing the body must re-run the check; re-running the whole build to
# do it would be absurd.
#
# merge_group: the merge queue waits for every required context on its
# gh-readonly-queue/main/* branch, and a merge group has no pull request body.
# Each job reports there under its own id, and passes through with a notice:
# the body was already checked on the pull request, and it becomes the squash
# commit message unchanged (ADR-0147).
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read

# Queued, never cancelled in progress. A body edit and a push land on the same
# commit within seconds; cancelling the older run left its "cancelled" result
# as the latest one for a required context, and the pull request blocked until
# someone re-ran it (#547). These jobs take seconds, so the newer run simply
# waits, and it always finishes last. A merge group's ref is its own queue
# branch, so queue runs never share a group (ADR-0147).
concurrency:
  group: linked-issue-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linked-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Merge group - the pull request's body was checked before it queued
        if: github.event_name == 'merge_group'
        run: echo "::notice::Checked on the pull request; a merge group has no body (ADR-0147)."

      - name: Body closes an issue
        if: github.event_name != 'merge_group'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_ACTOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          # Dependency bots open PRs that legitimately have no issue behind them.
          # Bracketed literally, because in a shell `case` pattern the brackets
          # in `renovate[bot]` would be a character class, not the login.
          if [ "$PR_ACTOR" = 'renovate[bot]' ] \
            || [ "$PR_ACTOR" = 'dependabot[bot]' ] \
            || [ "$PR_ACTOR" = 'github-actions[bot]' ]; then
            echo "::notice::$PR_ACTOR is a dependency bot — no linked issue required."
            exit 0
          fi

          # i18n-translate.yml's translation PR legitimately has no issue behind
          # it either — it's a recurring generated chore, not a backlog item —
          # but TRANSLATION_PR_TOKEN (see ADR-0021) is a personal fine-grained
          # PAT, so `gh pr create` records a real person as PR_ACTOR rather than
          # `github-actions[bot]`, and the exemption above cannot key off actor.
          # Its head branch name and PR body are both fixed by that workflow, so
          # match on those instead.
          if [ "$PR_HEAD_REF" = 'chore/fr-CA-translations' ] \
            && printf '%s' "$PR_BODY" | grep -qF 'Generated by `.github/workflows/i18n-translate.yml`'; then
            echo "::notice::This is the generated French UI strings PR — no linked issue required."
            exit 0
          fi

          if printf '%s' "$PR_BODY" | grep -Eiq '\b(close[sd]?|fixe?[sd]?|resolve[sd]?)[[:space:]]+#[0-9]+'; then
            printf '%s' "$PR_BODY" \
              | grep -Eio '\b(close[sd]?|fixe?[sd]?|resolve[sd]?)[[:space:]]+#[0-9]+' \
              | while read -r ref; do echo "::notice::Linked: $ref"; done
            exit 0
          fi

          echo "::error::This pull request does not close an issue."
          echo ""
          echo "Add a closing keyword to the pull request body, on its own line:"
          echo ""
          echo "    Closes #123"
          echo ""
          echo "GitHub closes the issue on merge only when the keyword is in the body"
          echo "(or the commit message). 'See #123' and 'Related to #123' do not count."
          echo ""
          echo "If the change genuinely has no issue behind it, open one first —"
          echo "the backlog is how this project tracks dependencies between changes."
          exit 1

  # The body becomes the squash commit message on a public repository, so a
  # coding agent's session link in it would publish that session. The agents
  # whose links are refused are a collection in the tool (ADR-0107). No bot
  # exemption: no author may publish one.
  no-session-link:
    runs-on: ubuntu-latest
    steps:
      - name: Merge group - the pull request's body was checked before it queued
        if: github.event_name == 'merge_group'
        run: echo "::notice::Checked on the pull request; a merge group has no body (ADR-0147)."

      - uses: actions/checkout@v7
        if: github.event_name != 'merge_group'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: github.event_name != 'merge_group'
        with:
          node-version: 24

      - name: Body carries no agent session link
        if: github.event_name != 'merge_group'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node tools/agent-session-links.mjs

  # A pull request that changes a rendered web file links its screenshots, or
  # says why it has none (ADR-0142). The rule lives in the tool, which reads
  # only the body and the changed-file list; it decides for itself whether the
  # pull request touches a rendered file, so the job runs on every one. Actions
  # sets GITHUB_REPOSITORY, which pins the screenshot links to this repository.
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Merge group - the pull request's body was checked before it queued
        if: github.event_name == 'merge_group'
        run: echo "::notice::Checked on the pull request; a merge group has no body (ADR-0147)."

      - uses: actions/checkout@v7
        if: github.event_name != 'merge_group'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: github.event_name != 'merge_group'
        with:
          node-version: 24

      - name: A rendered web change shows its screenshots
        if: github.event_name != 'merge_group'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA"...HEAD)
          export CHANGED_FILES
          node tools/pr-screenshots.mjs
