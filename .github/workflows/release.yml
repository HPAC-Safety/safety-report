---
# Release: one run, from `main`, creates a release and deploys it to staging
# (issues #466, #619, #621 — ADR-0158, ADR-0166, ADR-0168, CON-INF-011..013).
# Actions → Release → Run workflow. No inputs.
#
#   `release`  picks the next `YYYY.MM.DD-N` tag (today in UTC, next free N),
#              creates it at this run's `main` commit, and creates the GitHub
#              Release: a provenance table, then GitHub's generated notes —
#              every pull request merged since the previous release, grouped
#              by label (.github/release.yml).
#   `build`    makes the API image, the Worker image, and the web bundle
#              exactly once, tagged by commit SHA, and uploads them as
#              artifacts — no AWS credential of any kind, on purpose, so a bug
#              here can never reach either account.
#   `staging`  deploys them through the reusable deploy-environment.yml.
#
# Nothing here reaches production: promote.yml, run on a release's tag, finds
# the Release run for that tag's commit and deploys ITS artifacts after
# approval — the same artifacts, never a rebuild (CON-INF-012). So a release
# never asks for, or waits on, a production approval.
#
# `hpac-safety-staging` allows deployments from branch `main` as well as `20*`
# tags (infra/SETUP.md 2.1): this run is on `main`, and cannot run on the tag
# it creates. Production allows `20*` tags only. NOTHING here runs on push,
# merge, or pull_request: terraform.yml owns the credential-free validation
# and the PR plan against both accounts (CON-INF-007), and never applies.
#
# Built on #443 (the Lambda-adapter API image and tools/build-api-image.sh)
# and #465/#588 (infra/staging.tfvars, infra/production.tfvars, the
# multi-account Terraform, and every Terraform output deploy-environment.yml
# reads by name from infra/outputs.tf: deploy_variables,
# nat_autoscaling_group_arn, secret_entries, site_urls,
# dns_records_to_publish). tools/check-terraform-outputs.mjs fails CI if
# either file drifts from what infra/outputs.tf actually declares.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One release at a time: two runs would pick the same next tag, and race
  # for staging's Terraform state lock. Production has its own group in
  # promote.yml, so a promotion waiting on approval never holds a release
  # (lesson 0026).
  group: release-staging
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Create the tag and the GitHub Release.
      contents: write
    outputs:
      tag: ${{ steps.create.outputs.tag }}
    steps:
      - name: Create the next tag and its release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          SERVER: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Release from main only (this run is on $REF). Run workflow → Use workflow from → main."
            exit 1
          fi

          # Today's releases are YYYY.MM.DD-1, -2, ...; take the next free N.
          day=$(date -u +%Y.%m.%d)
          last=$(gh api "repos/$REPO/git/matching-refs/tags/$day-" --jq '.[].ref' \
            | sed -n "s|^refs/tags/$day-\([1-9][0-9]*\)$|\1|p" | sort -n | tail -n 1)
          tag="$day-$(( ${last:-0} + 1 ))"

          notes=$(mktemp)
          {
            echo "## Provenance"
            echo ""
            echo "| Commit | Release run |"
            echo "|---|---|"
            echo "| [\`$SHA\`]($SERVER/$REPO/commit/$SHA) | [run $RUN_ID]($SERVER/$REPO/actions/runs/$RUN_ID) |"
            echo ""
            echo "This run deploys it to staging. Promote to production: Actions → Promote → Use workflow from → Tags → \`$tag\`."
            echo ""
          } > "$notes"

          # --generate-notes appends every pull request merged since the
          # previous release, grouped by .github/release.yml.
          gh release create "$tag" --repo "$REPO" --target "$SHA" \
            --title "$tag" --notes-file "$notes" --generate-notes

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "### Release [$tag]($SERVER/$REPO/releases/tag/$tag)" >> "$GITHUB_STEP_SUMMARY"

  # No AWS credential anywhere in this job, deliberately (see this file's
  # header). It builds each artifact exactly once, tagged by the commit SHA
  # the tag points to, and hands the two image tarballs and the web bundle to
  # `staging`, and through this run's artifacts to promote.yml, unchanged.
  build:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mirror the Lambda Web Adapter into this org's GHCR and pull it from
      # there, never public.ecr.aws (#629).
      packages: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: src/web/package.json

      # The only push this job makes: the adapter image the API Dockerfile
      # names, copied once per version from public.ecr.aws into GHCR, and a
      # no-op on every later release (#629).
      - name: Mirror the Lambda Web Adapter
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: tools/mirror-lambda-adapter.sh

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      # tools/build-api-image.sh is #443's (the Lambda Web Adapter image,
      # ADR-0042). Built to the local Docker daemon only — nothing is pushed
      # from this job.
      - name: Build the API image
        run: tools/build-api-image.sh "hpac-safety-api:${{ steps.sha.outputs.sha }}"

      # tools/build-worker-image.sh already exists on main today (ADR-0118).
      - name: Build the Worker image
        run: tools/build-worker-image.sh "hpac-safety-worker:${{ steps.sha.outputs.sha }}"

      - name: Save the images as artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts/release
          docker save "hpac-safety-api:${{ steps.sha.outputs.sha }}" | gzip > artifacts/release/api-image.tar.gz
          docker save "hpac-safety-worker:${{ steps.sha.outputs.sha }}" | gzip > artifacts/release/worker-image.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-image
          path: artifacts/release/api-image.tar.gz
          retention-days: 90

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: worker-image
          path: artifacts/release/worker-image.tar.gz
          retention-days: 90

      - name: Build the web bundle
        run: |
          npm --prefix src/web ci
          npm --prefix src/web run build
          tar czf artifacts/release/web-dist.tar.gz -C src/web/dist .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-dist
          path: artifacts/release/web-dist.tar.gz
          retention-days: 90

  staging:
    needs: [release, build]
    # A reusable workflow's job holds no more than its caller grants:
    # deploy-environment.yml needs OIDC and to download this run's artifacts.
    permissions:
      contents: read
      id-token: write
      actions: read
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment_name: hpac-safety-staging
      tfvars_file: infra/staging.tfvars
      state_key: hpac-safety/staging.tfstate
      tag: ${{ needs.release.outputs.tag }}
      sha: ${{ needs.build.outputs.sha }}
    # `inherit`, not a named list: GEMINI_API_KEY is an
    # environment secret (H4), one value per environment under the same
    # name, and only resolve to the right one inside deploy-environment.yml's
    # own job, which sets `environment: ${{ inputs.environment_name }}`.
    # Naming them here would resolve against *this* job's (non-)environment
    # instead and pick up nothing.
    secrets: inherit

