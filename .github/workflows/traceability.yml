name: Traceability matrix

# Regenerates .spec/claims.json, .spec/traceability.md, and .spec/README.md
# onto a same-repo pull request's own branch, so nobody ever opens a pull
# request just to regenerate a generated file (ADR-0101, ADR-0193). It NEVER pushes to main, and it writes nothing for a fork.
#
# Why pull_request_target, and why that is safe here (ADR-0057 is the
# precedent, ADR-0101 the argument for this job):
#
#   * The commit has to land on the PR branch, and it has to re-trigger CI
#     on that branch, which needs a write token: `pull_request` never has one.
#   * No code the pull request wrote runs with that token. The generator is
#     taken from the BASE branch (the default checkout for this trigger) and
#     pointed at the head commit's files as plain data: it reads the
#     specification and the step-definition files as text, and writes three
#     generated files. The head is checked out without persisted credentials,
#     and nothing is installed.
#   * A pull request that changes the generator itself is skipped: the base
#     generator would render the old format. Its author regenerates locally
#     (the post-merge/post-rewrite hooks do it after every merge or rebase),
#     and ci.yml's "docs" job still checks the result with the head's code.
#
# A push can be rejected because the branch moved while this ran. When the
# newer push changed a file below, it started its own run, and this one is
# superseded (ADR-0106). When it didn't — i18n-translate.yml committed its
# French for the same push — nothing else will regenerate, so the commit is
# replayed on top and pushed again (ADR-0113). tools/github/push-to-pr-branch.ts
# decides which.
#
# A pull request merges through the merge queue (ADR-0147), where ci.yml's
# required "docs" job regenerates the matrix on the tree that will become main
# and fails a stale one, so nothing merges with a stale matrix (ADR-0101).
# This workflow never runs there: pull_request_target does not fire for a
# merge group, and it never pushes to a gh-readonly-queue/* branch.

on:
  pull_request_target:
    paths:
      - .spec/**
      - tools/spec/generate-traceability.ts
      - tools/spec/generate-spec-index.ts
      - tools/spec/spec-paths.ts
      - tools/spec/read-claims.ts
      - tools/spec/read-records.ts
      - tools/spec/step-bindings.ts
      - tools/spec/json-schema.ts
      - tools/spec/graph-fragment.ts
      - tools/docs/check-frontmatter.ts
      - tools/spec/regenerate-spec-docs.ts
      - tools/github/commit-to-pr-branch.ts
      - tools/github/read-node-major.ts
      - tools/lib/actions.ts
      - tests/HpacSafety.Acceptance.Tests/**
      - tests/e2e/steps/**
      - .github/workflows/traceability.yml

permissions:
  contents: read

# One run per pull request; a newer push supersedes an older run.
concurrency:
  group: traceability-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Resolving the step bindings compiles patterns read from the pull request's
    # own files; a pathological one stops here instead of holding a runner.
    timeout-minutes: 5
    steps:
      # The base branch: the trusted generator, and the pinned Node major.
      - uses: actions/checkout@v7
        with:
          path: base
          persist-credentials: false

      # The head commit by SHA, so a push landing between the event and this
      # checkout can't change what gets regenerated. Data only.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false

      # The Node major is pinned in ci.yml and nowhere else (ADR-0015).
      - name: Read the pinned Node major
        id: node
        run: node base/tools/github/read-node-major.ts base/.github/workflows/ci.yml

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.major }}

      # The claims, the matrix, and the specification index (ADR-0183,
      # ADR-0193) are all generated from .spec/, so one run regenerates them
      # and one commit carries them.
      - name: Regenerate the claims, the matrix, and the index with the base branch's generators
        id: regenerate
        run: node base/tools/spec/regenerate-spec-docs.ts base head

      # A push made with the built-in GITHUB_TOKEN does not trigger workflows
      # (GitHub's loop protection), so ci.yml would never re-run on this
      # commit. TRANSLATION_PR_TOKEN, the fine-grained PAT scoped to this
      # repository that i18n-translate.yml already uses for the same reason
      # (ADR-0021, ADR-0057), is what makes the required checks re-run. The
      # re-run of this job on that push finds nothing to change, so it can't
      # loop.
      - name: Commit the claims, the matrix, and the index onto the pull request's own branch
        if: steps.regenerate.outputs.changed == 'true'
        working-directory: head
        env:
          GH_TOKEN: ${{ secrets.TRANSLATION_PR_TOKEN || github.token }}
          USING_DEFAULT_TOKEN: ${{ secrets.TRANSLATION_PR_TOKEN == '' }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # --paths is this workflow's pull_request_target paths, verbatim;
        # tests/js/github/push-to-pr-branch.test.ts fails if they disagree. The
        # tool is the base branch's copy, like the generator, and pushes through
        # tools/github/push-to-pr-branch.ts.
        run: |
          node ../base/tools/github/commit-to-pr-branch.ts \
          --adr ADR-0101 \
          --add '.spec/claims.json,.spec/traceability.md,.spec/README.md' \
          --subject 'Regenerate the claims, traceability matrix, and specification index' \
          --paths '.spec/**,tools/spec/generate-traceability.ts,tools/spec/generate-spec-index.ts,tools/spec/spec-paths.ts,tools/spec/read-claims.ts,tools/spec/read-records.ts,tools/spec/step-bindings.ts,tools/spec/json-schema.ts,tools/spec/graph-fragment.ts,tools/docs/check-frontmatter.ts,tools/spec/regenerate-spec-docs.ts,tools/github/commit-to-pr-branch.ts,tools/github/read-node-major.ts,tools/lib/actions.ts,tests/HpacSafety.Acceptance.Tests/**,tests/e2e/steps/**,.github/workflows/traceability.yml'
