# Local dev only. Not used by CI or production — see docs/decisions/ADR-0015
# (init-dev.sh, machine bootstrap) and dev-up.sh (this file's counterpart,
# builds the api image and brings these services up).
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: hpac_safety
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hpac_safety"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Private attachment storage, S3-compatible, in its own container: the API
  # reaches it through the same S3BlobStore production uses against S3, so
  # only configuration differs (ADR-0096). RustFS, pinned to the same image
  # the test containers use (ADR-0110). Console at http://localhost:9001/rustfs/console/
  # (hpac-dev / hpac-dev-secret).
  s3:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: hpac-dev
      RUSTFS_SECRET_KEY: hpac-dev-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health/ready"]
      interval: 2s
      timeout: 2s
      retries: 15

  # One-shot: the bucket, versioned like production, with the same quarantine/
  # expiry infra/storage.tf gives S3. Plain AWS CLI, so nothing here depends on
  # the server's own tooling. Idempotent, so it runs on every ./dev-up.sh and
  # exits 0.
  s3-init:
    image: amazon/aws-cli:2.37.2
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: hpac-dev
      AWS_SECRET_ACCESS_KEY: hpac-dev-secret
      AWS_DEFAULT_REGION: ca-central-1
      AWS_ENDPOINT_URL: http://s3:9000
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        aws s3api head-bucket --bucket hpac-safety-uploads 2>/dev/null || aws s3api create-bucket --bucket hpac-safety-uploads
        aws s3api put-bucket-versioning --bucket hpac-safety-uploads --versioning-configuration Status=Enabled
        aws s3api put-bucket-lifecycle-configuration --bucket hpac-safety-uploads --lifecycle-configuration '{"Rules":[{"ID":"expire-quarantine","Status":"Enabled","Filter":{"Prefix":"quarantine/"},"Expiration":{"Days":15},"NoncurrentVersionExpiration":{"NoncurrentDays":1},"AbortIncompleteMultipartUpload":{"DaysAfterInitiation":1}}]}'
    restart: "no"

  api:
    image: hpacsafety-api:dev
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__HpacSafety: "Host=postgres;Port=5432;Database=hpac_safety;Username=postgres;Password=postgres"
      # Inside the compose network the S3 server is s3:9000. Reviewer URLs stay
      # signed for localhost:9000 (appsettings.Development.json), the host a
      # browser can reach.
      HpacSafety__Media__Storage__S3__ServiceUrl: "http://s3:9000"
      # From the primary checkout's .env (see dev-up.sh). Without it the API
      # reports translation unavailable and the Translate control is
      # disabled; there is no stand-in. See ADR-0062, ADR-0109.
      Translation__ApiKey: "${DEEPL_API_KEY:-}"
    ports:
      - "8080:8080"

  # Consumes the outbox: summaries, answer translations, and each
  # attachment's reviewer-safe derivative (ADR-0098). Without it no uploaded
  # image would ever become viewable in development.
  worker:
    image: hpacsafety-worker:dev
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__HpacSafety: "Host=postgres;Port=5432;Database=hpac_safety;Username=postgres;Password=postgres"
      HpacSafety__Media__Storage__S3__ServiceUrl: "http://s3:9000"
      # From the primary checkout's .env, as for the API. Without them a
      # summary or answer translation retries and is then marked failed;
      # attachment processing is unaffected. See ADR-0109.
      Translation__ApiKey: "${DEEPL_API_KEY:-}"
      # A paid, billing-enabled Gemini key (ADR-0104); provider, model, and
      # reasoning level come from the Worker's appsettings.json.
      AiChatClient__ApiKey: "${GEMINI_API_KEY:-}"

  web:
    image: node:24-alpine
    working_dir: /repo/src/web
    depends_on:
      - api
    environment:
      # The dev server proxies /api so the browser only ever talks to one
      # origin. Inside the compose network the API is `api:8080`, not the
      # localhost port vite.config.ts falls back to.
      HPAC_API_ORIGIN: "http://api:8080"
    volumes:
      - .:/repo
      - web-node-modules:/repo/src/web/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"

volumes:
  postgres-data:
  s3-data:
  web-node-modules:
