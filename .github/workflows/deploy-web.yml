name: Deploy Web

# SCAFFOLD. Infrastructure is #32 and #30. See docs/deployment.md.
#
# The public form and the admin queue deploy SEPARATELY, to separate buckets and
# separate distributions. Different audiences, different risk: the admin surface
# can then sit behind extra network controls without ever affecting a pilot's
# ability to file a report.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      site:
        description: 'Which site to deploy.'
        required: true
        default: both
        type: choice
        options: [both, public, admin]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  # Secrets:   AWS_DEPLOY_ROLE_ARN
  # Variables: AWS_REGION,
  #            S3_BUCKET_PUBLIC, S3_BUCKET_ADMIN,
  #            CLOUDFRONT_DISTRIBUTION_PUBLIC, CLOUDFRONT_DISTRIBUTION_ADMIN
  #
  # The Turnstile SITE key is public by design and may be a variable. The
  # Turnstile SECRET key is server-side only, lives in AWS Secrets Manager, and
  # must never reach a static bundle.
  preflight:
    # Three conditions, not one. `branches: [main]` above filters on the
    # triggering run's head_branch, and a pull_request-triggered CI run reports
    # its head_branch as the PR's source branch — so the filter alone is doing
    # load-bearing work whose exact semantics are not worth betting an S3 sync
    # on. These are explicit and cheap:
    #   event == push        only a merge to main, never a PR run or a dispatch
    #   head_branch == main  belt and braces on the filter above
    #   conclusion == success  never deploy a red build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      # Needed because require-config is a local composite action.
      - uses: actions/checkout@v7

      - uses: ./.github/actions/require-config
        with:
          secrets: |
            AWS_DEPLOY_ROLE_ARN=${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          variables: |
            AWS_REGION=${{ vars.AWS_REGION }}
            S3_BUCKET_PUBLIC=${{ vars.S3_BUCKET_PUBLIC }}
            S3_BUCKET_ADMIN=${{ vars.S3_BUCKET_ADMIN }}
            CLOUDFRONT_DISTRIBUTION_PUBLIC=${{ vars.CLOUDFRONT_DISTRIBUTION_PUBLIC }}
            CLOUDFRONT_DISTRIBUTION_ADMIN=${{ vars.CLOUDFRONT_DISTRIBUTION_ADMIN }}

  site:
    needs: preflight
    runs-on: ubuntu-latest
    environment: production
    strategy:
      # One site failing must not abandon the other mid-flight.
      fail-fast: false
      matrix:
        site: [public, admin]
    steps:
      - name: Skip sites not selected
        id: gate
        run: |
          selected='${{ inputs.site || 'both' }}'
          if [ "$selected" = both ] || [ "$selected" = '${{ matrix.site }}' ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.site }} not selected."
          fi

      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build stylesheet
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -x tools/build-css.sh ]; then
            ./tools/build-css.sh
          else
            echo "::warning::tools/build-css.sh does not exist yet — added by #10."
          fi

      - if: steps.gate.outputs.run == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync and invalidate
        if: steps.gate.outputs.run == 'true'
        run: |
          echo "::error::TODO(#30): sync src/web/${{ matrix.site }} and invalidate."
          echo "Shape:"
          echo "  aws s3 sync src/web/${{ matrix.site }} s3://\$BUCKET --delete"
          echo "  aws s3 sync src/web/shared s3://\$BUCKET/shared --delete"
          echo "  aws s3 sync locales        s3://\$BUCKET/locales --delete"
          echo "  aws cloudfront create-invalidation --distribution-id \$DIST --paths '/*'"
          echo ""
          echo "Clean URLs come from a CloudFront Function on the viewer-request"
          echo "event, not from S3 website hosting. That rewrite is part of the"
          echo "Terraform in #30 — this workflow only ships content."
          echo ""
          echo "Rollback: re-run this workflow from the previous commit."
          exit 1
