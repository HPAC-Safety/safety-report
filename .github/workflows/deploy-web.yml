name: Deploy Web

# SCAFFOLD. Infrastructure is #32 and #30. See docs/deployment.md.
#
# ONE website: the public form at /, the admin review queue at /admin/. One
# bucket, one distribution, one invalidation.
#
# This used to deploy two sites to two buckets behind two distributions. That is
# superseded by ADR-0031 — the admin queue is a route on the website, not a site
# of its own. The matrix below therefore selects which SUBTREE to sync, not which
# site: both land in the same bucket, the admin one under the admin key prefix.
#
# Nothing here is a security boundary. The admin bundle is static assets holding
# no report data; every byte a reviewer sees comes from the API, which authorizes
# each request (#24).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      site:
        description: 'Which site to deploy.'
        required: true
        default: both
        type: choice
        options: [both, public, admin]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  # Secrets:   AWS_DEPLOY_ROLE_ARN
  # Variables: AWS_REGION, S3_BUCKET_SITE, CLOUDFRONT_DISTRIBUTION_SITE,
  #            SITE_ADMIN_PREFIX
  #
  # The Turnstile SITE key is public by design and may be a variable. The
  # Turnstile SECRET key is server-side only, lives in AWS Secrets Manager, and
  # must never reach a static bundle.
  preflight:
    # Three conditions, not one. `branches: [main]` above filters on the
    # triggering run's head_branch, and a pull_request-triggered CI run reports
    # its head_branch as the PR's source branch — so the filter alone is doing
    # load-bearing work whose exact semantics are not worth betting an S3 sync
    # on. These are explicit and cheap:
    #   event == push        only a merge to main, never a PR run or a dispatch
    #   head_branch == main  belt and braces on the filter above
    #   conclusion == success  never deploy a red build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      # Needed because require-config is a local composite action.
      - uses: actions/checkout@v7

      - uses: ./.github/actions/require-config
        with:
          secrets: |
            AWS_DEPLOY_ROLE_ARN=${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          variables: |
            AWS_REGION=${{ vars.AWS_REGION }}
            S3_BUCKET_SITE=${{ vars.S3_BUCKET_SITE }}
            CLOUDFRONT_DISTRIBUTION_SITE=${{ vars.CLOUDFRONT_DISTRIBUTION_SITE }}
            SITE_ADMIN_PREFIX=${{ vars.SITE_ADMIN_PREFIX }}

  site:
    needs: preflight
    runs-on: ubuntu-latest
    environment: production
    strategy:
      # One site failing must not abandon the other mid-flight.
      fail-fast: false
      matrix:
        site: [public, admin]
    steps:
      - name: Skip subtrees not selected
        id: gate
        run: |
          selected='${{ inputs.site || 'both' }}'
          if [ "$selected" = both ] || [ "$selected" = '${{ matrix.site }}' ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.site }} not selected."
          fi

      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build stylesheet
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -x tools/build-css.sh ]; then
            ./tools/build-css.sh
          else
            echo "::warning::tools/build-css.sh does not exist yet — added by #10."
          fi

      - if: steps.gate.outputs.run == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync and invalidate
        if: steps.gate.outputs.run == 'true'
        run: |
          echo "::error::TODO(#30): sync src/web/${{ matrix.site }} and invalidate."
          echo "Shape — ONE bucket, the admin subtree under its own key prefix:"
          echo "  public: aws s3 sync src/web/public s3://\$S3_BUCKET_SITE --delete"
          echo "  admin:  aws s3 sync src/web/admin  s3://\$S3_BUCKET_SITE/\$SITE_ADMIN_PREFIX --delete"
          echo "          aws s3 sync src/web/shared s3://\$S3_BUCKET_SITE/shared --delete"
          echo "          aws s3 sync locales        s3://\$S3_BUCKET_SITE/locales --delete"
          echo "          aws cloudfront create-invalidation --distribution-id \$CLOUDFRONT_DISTRIBUTION_SITE --paths '/*'"
          echo ""
          echo "--delete on the public sync must NOT be allowed to reach the admin"
          echo "prefix. Scope it, or sync the two subtrees under one prefix each."
          echo ""
          echo "Clean URLs come from a CloudFront Function on the viewer-request"
          echo "event, not from S3 website hosting. That rewrite is Terraform, in"
          echo "infra/functions/clean-urls.js.tftpl — this workflow ships content."
          echo ""
          echo "Rollback: re-run this workflow from the previous commit."
          exit 1
