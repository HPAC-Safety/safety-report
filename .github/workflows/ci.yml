name: CI

# Public repository. Fork pull requests run here, so this workflow uses
# `pull_request` and NEVER `pull_request_target` — the latter would run
# fork-authored code with a write token and repository secrets in scope.
#
# No job below reads a secret. Anything that needs one (the Anthropic client,
# for instance) runs against recorded fixtures instead. Keep it that way.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Job ids are the status-check contexts named in docs/github-ruleset.json.
  # Renaming a job renames the context and silently drops it from the required
  # set — the ruleset keeps waiting on a name nothing reports.

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Preinstalled on the runner. init-dev.sh is POSIX sh, not bash: Windows
      # contributors run it under Git Bash, so a bashism would break the one
      # platform nobody here tests on by hand. See ADR-0015.
      - name: shellcheck init-dev.sh
        run: shellcheck -s sh init-dev.sh

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore HpacSafety.slnx
      # Directory.Build.props sets TreatWarningsAsErrors, so a warning already
      # fails. --warnaserror is belt and braces for anything outside that scope.
      - run: dotnet build HpacSafety.slnx --configuration Release --no-restore --warnaserror

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Exercises the version parsing on every pull request. setup-dotnet and
      # setup-node above have already satisfied the versions init-dev.sh reads
      # out of global.json and this file, so a failure here means the script
      # stopped agreeing with the files that pin them - which is exactly the
      # drift ADR-0015 exists to prevent. --check installs nothing.
      - name: init-dev.sh --check
        run: ./init-dev.sh --check

      - name: dotnet test
        run: dotnet test HpacSafety.slnx --configuration Release

      # The suite is passed as an explicit file list rather than as a
      # directory: `node --test tests/js` resolves the path as a module and
      # fails with MODULE_NOT_FOUND on the pinned Node.
      - name: node --test
        run: |
          suite=$(find tests/js -name '*.test.mjs' -o -name '*.test.js' 2>/dev/null)
          if [ -n "$suite" ]; then
            # shellcheck disable=SC2086
            node --test $suite
          else
            echo "::notice::No JavaScript test suite yet — added by #8. Skipping."
          fi

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reading the baseline artifact from main's last green run.
      actions: read
      # Posting the summary comment. Fork pull requests get a read-only token,
      # so the comment step is skipped for them - see the step's condition.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Restore tools
        run: dotnet tool restore

      # coverlet.runsettings excludes generated code. Without it the API reports
      # 4.8% while Program.cs is at 100%, because the OpenApi source generator
      # emits ~440 lines into obj/ that no test will ever run.
      - name: Collect .NET coverage
        run: >
          dotnet test HpacSafety.slnx
          --configuration Release
          --collect:"XPlat Code Coverage"
          --settings coverlet.runsettings
          --results-directory ./artifacts/coverage

      - name: Collect JavaScript coverage
        run: |
          suite=$(find tests/js -name '*.test.mjs' -o -name '*.test.js' 2>/dev/null)
          if [ -n "$suite" ]; then
            mkdir -p ./artifacts/coverage/js
            # shellcheck disable=SC2086
            node --test --experimental-test-coverage \
              --test-reporter=lcov --test-reporter-destination=./artifacts/coverage/js/lcov.info \
              $suite
          else
            echo "::notice::No JavaScript test suite yet - added by #8. The merge below picks it up automatically once tests/js exists."
          fi

      # ReportGenerator merges every Cobertura and lcov file it finds into one
      # report, so the JS half needs no wiring here beyond producing lcov.
      - name: Merge into one report
        run: >
          dotnet tool run reportgenerator
          "-reports:./artifacts/coverage/**/coverage.cobertura.xml;./artifacts/coverage/**/lcov.info"
          "-targetdir:./artifacts/report"
          "-reporttypes:Cobertura;MarkdownSummaryGithub;HtmlInline"

      # The ratchet compares against main's last green run rather than
      # recomputing it, which would double this job's time and re-run the
      # Testcontainers suite for a number that is already known. See ADR-0014.
      - name: Fetch the main baseline
        id: baseline
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          run_id=$(gh run list --workflow CI --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)

          if [ -z "${run_id:-}" ]; then
            echo "::notice::No successful CI run on main yet. The ratchet will not run; the floor still applies."
            echo "path=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh run download "$run_id" --name coverage-report --dir ./artifacts/baseline 2>/dev/null \
            && [ -f ./artifacts/baseline/Cobertura.xml ]; then
            echo "Baseline from main run $run_id."
            echo "path=./artifacts/baseline/Cobertura.xml" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main run $run_id has no coverage-report artifact - it predates this job, or the artifact expired. Ratchet skipped; the floor still applies."
            echo "path=none" >> "$GITHUB_OUTPUT"
          fi

      # Output is captured to comment.md here, once, rather than re-run by the
      # comment step below - the script writes to $GITHUB_STEP_SUMMARY as a
      # side effect, and running it twice duplicated the table in the job
      # summary.
      - name: Gate
        id: gate
        run: |
          set -o pipefail
          {
            echo "<!-- coverage-gate -->"
            node tools/coverage-gate.mjs \
              --report ./artifacts/report/Cobertura.xml \
              --baseline "${{ steps.baseline.outputs.path || 'none' }}" \
              --min-line 80 --min-branch 70
          } 2>&1 | tee comment.md

      # The detailed per-file table, always, so a failure is diagnosable from
      # the run page without downloading anything.
      - name: Detail in the job summary
        if: always()
        run: |
          if [ -f ./artifacts/report/SummaryGithub.md ]; then
            {
              echo ""
              echo "<details><summary>Per-assembly detail</summary>"
              echo ""
              cat ./artifacts/report/SummaryGithub.md
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Skipped on fork pull requests, whose token cannot write. The job summary
      # above carries the same information, so nothing is lost - a failing gate
      # is still fully diagnosable from the run page.
      - name: Comment on the pull request
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # comment.md was written by the Gate step above.
          # --edit-last keeps one comment that updates, rather than a new one on
          # every push. --create-if-none covers the first run on a pull request.
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file comment.md --edit-last --create-if-none

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: |
            ./artifacts/report/Cobertura.xml
            ./artifacts/report/SummaryGithub.md
            ./artifacts/report/*.html
          if-no-files-found: warn

  # No setup-node here, and none is coming. The web layer builds with the
  # Tailwind standalone binary and nothing else - if this job ever needs Node,
  # something has grown a node_modules it should not have. See ADR-0006.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Preinstalled on the runner. build-css.sh is POSIX sh for the same
      # reason init-dev.sh is: Windows contributors run it under Git Bash.
      - name: shellcheck build-css.sh
        run: shellcheck -s sh tools/build-css.sh

      # Downloads the pinned binary named in tools/tailwind.pin and verifies it
      # against the checksum recorded there before running it. A clean checkout
      # with no node_modules is exactly the case this proves. See ADR-0023.
      - name: Build stylesheet
        run: ./tools/build-css.sh

      - name: The stylesheet was produced
        run: test -s src/web/styles/site.css

      # The acceptance criterion from #11, checked rather than trusted: nothing
      # in the built stylesheet or in any page reaches Google for a font. The
      # @font-face URLs are relative paths into src/web/assets/fonts.
      - name: No third-party font requests
        run: |
          set -eu
          hits=$(grep -rIl -e fonts.googleapis.com -e fonts.gstatic.com \
            src/web --include='*.css' --include='*.html' --include='*.js' || true)
          if [ -n "$hits" ]; then
            echo "::error::Fonts must be self-hosted from src/web/assets/fonts. Found a Google Fonts reference in:"
            echo "$hits"
            exit 1
          fi

      # Raw hex in markup defeats the token system: a literal colour cannot be
      # re-themed, so it is the one thing that stays light when everything
      # around it goes dark. Hex values belong in tailwind.css, which is why
      # only markup is scanned here. See ADR-0024.
      #
      # CSS hex colours come in four valid lengths - #rgb, #rgba, #rrggbb,
      # #rrggbbaa - and Tailwind arbitrary values (bg-[#f22312ff]) use the
      # 4- and 8-digit alpha forms routinely. The alternation below is
      # ordered longest-first so grep reports the whole literal rather than a
      # 6-digit prefix of an 8-digit one; POSIX ERE alternation is
      # leftmost-longest at each position regardless of order, but the order
      # keeps the intent readable.
      #
      # Known false positive, left as-is rather than fixed: a hex-shaped
      # anchor fragment - href="#bad", href="#dead" - matches the 3/4-digit
      # branch. Distinguishing "#bad" the fragment from "#bad" the colour
      # needs the surrounding attribute context (href=, id=, a CSS
      # declaration, a Tailwind bracket), which turns a one-line content lint
      # into a small parser for one rare collision - a fragment id that also
      # happens to be a valid hex string. Cheaper to rename the anchor than to
      # carry that complexity in a grep gate.
      - name: No raw hex in markup
        run: |
          set -eu
          hits=$(grep -rInE '#[0-9a-fA-F]{8}\b|#[0-9a-fA-F]{6}\b|#[0-9a-fA-F]{4}\b|#[0-9a-fA-F]{3}\b' \
            src/web --include='*.html' --include='*.js' || true)
          if [ -n "$hits" ]; then
            echo "::error::Raw hex values belong in src/web/styles/tailwind.css. Use the @theme tokens in markup:"
            echo "$hits"
            exit 1
          fi

      # site.css is generated and gitignored. If a build produces a tracked
      # change, something that should be generated has been committed.
      - name: No drift from building
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Building the stylesheet modified tracked files:"
            git status --porcelain
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Playwright
        run: |
          if [ ! -f tests/e2e/package.json ]; then
            echo "::notice::No end-to-end suite yet — added by #26. Skipping."
            exit 0
          fi
          npm --prefix tests/e2e ci
          npx --prefix tests/e2e playwright install --with-deps chromium
          npm --prefix tests/e2e test

  agent-config:
    runs-on: ubuntu-latest
    steps:
      # Symlinks only survive checkout when core.symlinks is on; it is by
      # default on Linux runners. If that ever changes this job is what notices.
      - uses: actions/checkout@v7

      - name: Agent instruction symlinks resolve to AGENTS.md
        run: |
          set -euo pipefail
          canonical=$(readlink -f AGENTS.md)
          fail=0
          for link in CLAUDE.md .github/copilot-instructions.md .cursor/rules/agents.mdc; do
            if [ ! -L "$link" ]; then
              echo "::error file=$link::Not a symlink. It must point at AGENTS.md."
              fail=1
              continue
            fi
            target=$(readlink -f "$link" || true)
            if [ "$target" != "$canonical" ]; then
              echo "::error file=$link::Resolves to '${target:-<broken>}', expected '$canonical'."
              fail=1
            fi
          done
          exit $fail

      - name: Install skillfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.9.1 \
            --repo eljulians/skillfile \
            --pattern skillfile-x86_64-linux \
            --output "$RUNNER_TEMP/skillfile"
          chmod +x "$RUNNER_TEMP/skillfile"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Skillfile validates and installs from the lock
        run: |
          set -euo pipefail
          skillfile validate
          skillfile install
          skillfile status

      # The deploy workflows never run on a pull request - by design, they
      # trigger on a push to main. So nothing exercises a local action they
      # depend on until it is already merged, and a manifest error surfaces on
      # main or not at all. That is how #36 got in. Loading the action here
      # parses its manifest on every pull request.
      - name: Local composite actions load
        uses: ./.github/actions/require-config
        with:
          secrets: |
            EXERCISE_SECRET=present
          variables: |
            EXERCISE_VARIABLE=present
          context: 'This is a CI self-test of the action, not a real deploy.'

      # .claude/skills and .claude/agents are gitignored. If `skillfile install`
      # ever starts writing tracked files, that is drift worth failing on.
      - name: No drift from installing skills
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::skillfile install modified tracked files:"
            git status --porcelain
            exit 1
          fi

  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Locale key parity
        run: |
          if [ ! -f locales/en-CA.json ]; then
            echo "::notice::No locale files yet — added by #7. Skipping."
            exit 0
          fi
          if [ ! -f tools/check-locales.mjs ]; then
            echo "::error::locales/en-CA.json exists but tools/check-locales.mjs does not. See #8."
            exit 1
          fi
          node tools/check-locales.mjs

      - name: No hardcoded user-facing strings
        run: |
          if [ ! -f tools/check-hardcoded-strings.mjs ]; then
            echo "::notice::Hardcoded-string lint not written yet — added by #8. Skipping."
            exit 0
          fi
          node tools/check-hardcoded-strings.mjs

      # VERIFY ONLY. --check reads the three locale files and constructs no
      # translator, so no inference happens here and no locale file is written.
      # That is not a detail: this workflow runs fork-authored code on
      # `pull_request` with a read-only token, and untrusted code must never be
      # able to trigger a model call or edit generated French. Generation lives
      # in i18n-translate.yml, which runs only on a push to main. See ADR-0021.
      #
      # No provider configuration is passed into this step, on purpose. There is
      # nothing here for it to use.
      - name: Locale translation is in step with English
        run: node tools/translate-locale.mjs --check --locales locales
