# Local dev only. Not used by CI or production — see docs/decisions/ADR-0015
# (init-dev.sh, machine bootstrap) and dev-up.sh (this file's counterpart,
# builds the api image and brings these services up).
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: hpac_safety
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hpac_safety"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Private attachment storage, S3-compatible, in its own container: the API
  # reaches it through the same S3BlobStore production uses against S3, so
  # only configuration differs (ADR-0096). Pinned, like the test containers.
  # Console at http://localhost:9001 (hpac-dev / hpac-dev-secret).
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hpac-dev
      MINIO_ROOT_PASSWORD: hpac-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 15

  # One-shot: the bucket, versioned like production, with the same 1-day
  # quarantine/ expiry infra/storage.tf gives S3. Idempotent, so it runs on
  # every ./dev-up.sh and exits 0.
  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 hpac-dev hpac-dev-secret
        mc mb --ignore-existing local/hpac-safety-uploads
        mc version enable local/hpac-safety-uploads
        echo '{"Rules":[{"ID":"expire-quarantine","Status":"Enabled","Filter":{"Prefix":"quarantine/"},"Expiration":{"Days":1},"NoncurrentVersionExpiration":{"NoncurrentDays":1},"AbortIncompleteMultipartUpload":{"DaysAfterInitiation":1}}]}' | mc ilm import local/hpac-safety-uploads
    restart: "no"

  api:
    image: hpacsafety-api:dev
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__HpacSafety: "Host=postgres;Port=5432;Database=hpac_safety;Username=postgres;Password=postgres"
      # Inside the compose network MinIO is minio:9000. Reviewer URLs stay
      # signed for localhost:9000 (appsettings.Development.json), the host a
      # browser can reach.
      HpacSafety__Media__Storage__S3__ServiceUrl: "http://minio:9000"
      # Optional. Export DEEPL_API_KEY before ./dev-up.sh to get a working
      # Translate button on /admin/questions; without it the API reports
      # translation unavailable and the control is disabled. See ADR-0062.
      Translation__ApiKey: "${DEEPL_API_KEY:-}"
    ports:
      - "8080:8080"

  # Consumes the outbox: summaries, answer translations, and each
  # attachment's reviewer-safe derivative (ADR-0098). Without it no uploaded
  # image would ever become viewable in development.
  worker:
    image: hpacsafety-worker:dev
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__HpacSafety: "Host=postgres;Port=5432;Database=hpac_safety;Username=postgres;Password=postgres"
      HpacSafety__Media__Storage__S3__ServiceUrl: "http://minio:9000"
      # Optional, as for the API: without them a summary or translation waits
      # and retries, and attachment processing is unaffected.
      Translation__ApiKey: "${DEEPL_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"

  web:
    image: node:24-alpine
    working_dir: /repo/src/web
    depends_on:
      - api
    environment:
      # The dev server proxies /api so the browser only ever talks to one
      # origin. Inside the compose network the API is `api:8080`, not the
      # localhost port vite.config.ts falls back to.
      HPAC_API_ORIGIN: "http://api:8080"
    volumes:
      - .:/repo
      - web-node-modules:/repo/src/web/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"

volumes:
  postgres-data:
  minio-data:
  web-node-modules:
