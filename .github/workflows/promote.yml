---
# Promote a tag already green on staging to production (issue #609,
# ADR-0166, CON-INF-012).
#
# release.yml builds once and deploys staging only, so many releases can
# reach staging without any of them asking for a production approval. This
# workflow is the separate, deliberate step that sends one of them on: a
# maintainer dispatches it ON a release tag, it finds the successful
# release.yml run built from that tag's commit, and deploys THAT run's artifacts — the same
# images and web bundle staging ran, never a rebuild — through the same
# deploy-environment.yml. The `hpac-safety-production` GitHub environment's
# required reviewers gate the deploy job; nothing here re-implements that.
#
# It runs on the tag it is dispatched on ("Use workflow from" → the tag, or
# `gh workflow run promote.yml --ref <tag>`), not a tag typed as an input:
# `hpac-safety-production` allows deployments only from refs matching `20*`
# (infra/SETUP.md 3.1), so a run dispatched from a branch would be refused by
# the environment itself.
#
# It refuses, before any AWS call:
#   - a run not dispatched on a tag, or on one that is not YYYY.MM.DD-N;
#   - a tag with no successful Release run for its commit (never green on
#     staging);
#   - a run whose artifacts have expired (release.yml keeps them 90 days) —
#     run Release to cut a new release, then promote that one.
#
# Production rollback is this same workflow on an earlier tag.
name: Promote

run-name: Promote ${{ github.ref_name }} to production

on:
  # No inputs: choose the release tag under "Use workflow from".
  workflow_dispatch:

permissions:
  contents: read
  # Reading another run's metadata and artifacts (locate, and
  # deploy-environment.yml's download).
  actions: read
  # A reusable workflow's job can never hold more than its caller grants;
  # deploy-environment.yml needs it for OIDC.
  id-token: write

concurrency:
  # Production's own group, apart from release.yml's `release-staging`: a
  # promotion waiting on its approval holds only other promotions, never a
  # staging release (lesson 0026). A second promotion dispatched while one
  # waits queues behind it, and GitHub cancels an older queued one.
  group: promote-production
  cancel-in-progress: false

jobs:
  locate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.find.outputs.tag }}
      sha: ${{ steps.find.outputs.sha }}
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Find the tag's green release run and its artifacts
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: node tools/github/find-release-run.ts

  production:
    needs: locate
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment_name: hpac-safety-production
      tfvars_file: infra/production.tfvars
      state_key: hpac-safety/production.tfstate
      tag: ${{ needs.locate.outputs.tag }}
      sha: ${{ needs.locate.outputs.sha }}
      artifacts_run_id: ${{ needs.locate.outputs.run_id }}
    # `inherit`: GEMINI_API_KEY and DEEPL_API_KEY are environment secrets,
    # resolved inside deploy-environment.yml's own job (see release.yml).
    secrets: inherit
