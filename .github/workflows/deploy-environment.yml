---
# Deploy one environment's already-built artifacts to its AWS account
# (CON-INF-011, CON-INF-012, ADR-0158, ADR-0164). Reusable (`workflow_call`)
# only — it has no trigger of its own, so it never appears as a workflow a
# person can run directly and does not count against "one release workflow"
# (issue #466). release.yml calls it for `hpac-safety-staging`; promote.yml calls
# it for `hpac-safety-production`, passing the release run's ID so the identical
# image digests and web bundle staging ran are deployed (issue #609, ADR-0166).
# Keeping the steps in one file is deliberate: staging and production must do
# EXACTLY the same thing, and two hand-maintained copies would drift the day
# someone edits one and not the other.
#
# Every AWS call in this file is real. It only ever runs from release.yml or
# promote.yml, each dispatched by a maintainer — never on
# push, merge, or pull_request. See both callers' headers before changing that.
name: Deploy environment

on:
  workflow_call:
    inputs:
      environment_name:
        description: 'The GitHub environment to run under: hpac-safety-staging or hpac-safety-production. Its variables and secrets are what the deploy job below reads (its own `environment:` key is set to this input), and its own protection rules (approval, deployment tag policy) are what actually gate the job — nothing here re-implements that.'
        required: true
        type: string
      tfvars_file:
        description: 'Path to this environment''s tfvars, e.g. infra/staging.tfvars.'
        required: true
        type: string
      state_key:
        description: 'This environment''s Terraform state object key inside the shared state bucket (CON-INF-011: one state bucket per account, so the key only has to separate environments if a bucket is ever shared — kept distinct regardless, so a future change of that assumption is not a migration).'
        required: true
        type: string
      tag:
        description: 'The release tag being deployed, e.g. 2026.10.02-1. Used only for messages and the job summary.'
        required: true
        type: string
      sha:
        description: 'The commit SHA the build job tagged every artifact with.'
        required: true
        type: string
      artifacts_run_id:
        description: 'The workflow run whose artifacts to deploy. Empty (release.yml) means this run; promote.yml passes the release run it is promoting, so production deploys exactly what that run built and staged.'
        required: false
        type: string
        default: ''
    secrets:
      # Named here for documentation even though release.yml calls this
      # workflow with `secrets: inherit` — the values below still resolve
      # against THIS job's own `environment:` (set below), which is what
      # actually picks the right environment secret; `inherit` only decides
      # that a same-named secret is passed through at all.
      GEMINI_API_KEY:
        required: true
      DEEPL_API_KEY:
        required: true

permissions:
  contents: read
  id-token: write
  # download-artifact reads another run's artifacts through the API.
  actions: read

env:
  AWS_REGION: ca-central-1
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: '0'

jobs:
  deploy:
    name: Deploy (${{ inputs.environment_name }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    steps:
      # First: require-config below is a local action, read from the
      # workspace, which is empty until checkout (issue #623).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}

      # The deploy steps' scripts come from this workflow's own commit, not the
      # tag: the steps are this workflow's logic, so a tag cut before a script
      # existed still deploys with the logic the workflow names (ADR-0189).
      - name: Check out the deploy scripts at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout: tools
          persist-credentials: false

      # Node 24 runs the .ts scripts under tools/ by type stripping (ADR-0189); the runner's preinstalled Node is older.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      # Named, not opaque: a missing value fails here with the name that is
      # missing, not thirty steps later inside an AWS CLI error.
      - name: Required configuration is present
        uses: ./.github/actions/require-config
        with:
          secrets: |
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            DEEPL_API_KEY=${{ secrets.DEEPL_API_KEY }}
          variables: |
            AWS_DEPLOY_ROLE_ARN=${{ vars.AWS_DEPLOY_ROLE_ARN }}
            TF_STATE_BUCKET=${{ vars.TF_STATE_BUCKET }}
            AWS_ACCOUNT_ID=${{ vars.AWS_ACCOUNT_ID }}
          context: >-
            ${{ inputs.environment_name }} has not been bootstrapped yet.
            See infra/SETUP.md (steps 2.2-2.4, or 3.2-3.4) and infra/bootstrap.sh.

      - name: Download the release's built artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts/release
          run-id: ${{ inputs.artifacts_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: release-${{ inputs.tag }}-${{ inputs.environment_name }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install the pinned Terraform
        run: node .workflow-tools/tools/infra/install-terraform.ts

      - name: terraform init
        run: |
          terraform -chdir=infra init \
            -lockfile=readonly \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ inputs.state_key }}"

      # An apply that fails after AWS has created a resource leaves it
      # tainted, and Terraform then plans to destroy and recreate it. For a
      # resource carrying prevent_destroy (the database, the uploads bucket,
      # the log groups, the secrets) that plan is refused, so every later
      # release would stop here until someone untainted it by hand (#640).
      # Untaint only those; the apply below then brings each one to its
      # configuration in place. Any other tainted resource is still replaced.
      - name: Untaint resources that must never be replaced
        run: node .workflow-tools/tools/infra/deploy/untaint-protected-resources.ts

      # A Lambda function is created from an image that must already be in
      # ECR (CreateFunction refuses a missing one), so on an account's first
      # release the registries come first, then the images, then everything
      # else (#623). Every later release this targeted apply changes nothing.
      - name: Create the image registries
        run: |
          terraform -chdir=infra apply -no-color -auto-approve \
            -target='aws_ecr_repository.this' \
            -target='aws_ecr_lifecycle_policy.this' \
            -var-file="$GITHUB_WORKSPACE/${{ inputs.tfvars_file }}"

      # Read from state, not from `deploy_variables`: that output also names
      # the Lambda functions and buckets, which do not exist yet on a first
      # release.
      - name: Read the image registries
        id: ecr
        run: node .workflow-tools/tools/infra/deploy/read-image-registries.ts

      - name: Log in to this account's ECR
        run: |
          aws ecr get-login-password --region "${{ env.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "${{ steps.ecr.outputs.registry }}"

      # Tagged with the commit SHA (what a rollback names) and `latest` (what
      # lambda.tf's `image_uri` names on a function's first creation; ignored
      # after that — the functions are updated by digest below).
      - name: Load and push the API and Worker images
        id: images
        env:
          SHA: ${{ inputs.sha }}
          API_REPO: ${{ steps.ecr.outputs.api_repo }}
          WORKER_REPO: ${{ steps.ecr.outputs.worker_repo }}
        run: node .workflow-tools/tools/infra/deploy/push-images.ts

      # No plan-then-apply-the-plan-file here, unlike terraform.yml's old
      # `apply` job: a release environment auto-applies on staging and applies
      # behind a human approval on production (the environment's own required
      # reviewer, not a second plan review), so the pull request's plan
      # (terraform.yml) is the review artifact, and this step is what carries
      # out what that plan already showed. The drift check right after this is
      # what stands in for reviewing the plan a second time.
      # -var-file is absolute: Terraform resolves it after -chdir=infra, so the
      # repository-root path the callers pass would be looked for under infra/
      # (#615).
      - name: terraform apply
        run: |
          terraform -chdir=infra apply -no-color -auto-approve \
            -var-file="$GITHUB_WORKSPACE/${{ inputs.tfvars_file }}"

      # CON-INF-013 / ADR-0158: fails the job if applying planned to (or, after
      # applying, still would) destroy anything other than the NAT instance
      # (the script's header has the reasoning).
      - name: Re-plan and fail on drift
        env:
          TFVARS_FILE: ${{ inputs.tfvars_file }}
        run: node .workflow-tools/tools/infra/deploy/fail-on-drift.ts

      # The NAT instance is the one resource this system ever deletes and
      # recreates, every release (CON-INF-013).
      - name: Replace the NAT instance
        run: node .workflow-tools/tools/infra/deploy/replace-nat-instance.ts

      - name: Read Terraform's deploy variables
        id: tf
        run: node .workflow-tools/tools/infra/deploy/read-deploy-variables.ts

      # Same content pushed by every environment — same manifest digest in
      # every account's ECR. This is what "the same image digests, never a
      # rebuild" (CON-INF-012) actually rests on: content addressing, not trust.
      - name: Record this environment's image digests
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment_name }}
          API_DIGEST: ${{ steps.images.outputs.api_digest }}
          WORKER_DIGEST: ${{ steps.images.outputs.worker_digest }}
        run: node .workflow-tools/tools/infra/deploy/report-image-digests.ts

      - name: Copy vendor keys into Secrets Manager
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: node .workflow-tools/tools/infra/deploy/copy-vendor-keys.ts

      # The temporary interim issuer's one signing key (issue #648, ADR-0172,
      # TEMPORARY: deleted along with the whole feature once a real identity
      # provider exists). A no-op where the interim issuer is disabled
      # (production). The deploy role only ever writes this secret (ADR-0171).
      - name: Generate the interim issuer signing key, if it does not exist yet
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment_name }}
        run: node .workflow-tools/tools/infra/deploy/generate-interim-issuer-key.ts

      - name: Update the API Lambda function
        env:
          FUNCTION_NAME: ${{ steps.tf.outputs.LAMBDA_FUNCTION_API }}
          IMAGE_URI: ${{ steps.ecr.outputs.api_repo }}@${{ steps.images.outputs.api_digest }}
        run: node .workflow-tools/tools/infra/deploy/update-lambda-function.ts

      - name: Update the Worker Lambda function
        env:
          FUNCTION_NAME: ${{ steps.tf.outputs.LAMBDA_FUNCTION_WORKER }}
          IMAGE_URI: ${{ steps.ecr.outputs.worker_repo }}@${{ steps.images.outputs.worker_digest }}
        run: node .workflow-tools/tools/infra/deploy/update-lambda-function.ts

      - name: Create the website bundle directory
        run: mkdir -p /tmp/web-dist

      - name: Unpack the website bundle
        run: tar xzf artifacts/release/web-dist/web-dist.tar.gz -C /tmp/web-dist

      # CON-INF-027 (#805). The files under assets/ are content-hashed, so
      # they never change and are cached for a year. They are uploaded first,
      # so no new page can name a file that is not there yet. The page and
      # every unhashed file come next, as no-cache, so a returning visitor
      # revalidates and gets this release. The previous release's assets are
      # deleted last.
      - name: Upload the website's hashed assets
        run: |
          aws s3 sync /tmp/web-dist/assets "s3://${{ steps.tf.outputs.S3_BUCKET_SITE }}/assets" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload the website's page and unhashed files
        run: |
          aws s3 sync /tmp/web-dist "s3://${{ steps.tf.outputs.S3_BUCKET_SITE }}" \
            --exclude "assets/*" --cache-control "no-cache" --delete

      - name: Delete the previous release's assets
        run: |
          aws s3 sync /tmp/web-dist/assets "s3://${{ steps.tf.outputs.S3_BUCKET_SITE }}/assets" \
            --cache-control "public, max-age=31536000, immutable" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.CLOUDFRONT_DISTRIBUTION_SITE }}" \
            --paths '/*' >/dev/null

      # site_urls is keyed by hostname (staging has exactly one - the
      # CloudFront default address; production has both hpac.ca/acvl.ca
      # hostnames) so any one entry's `public` URL reaches the same
      # distribution and the same /api/health - the smoke test only needs
      # one to answer.
      - name: Read the site URL
        id: site
        run: echo "public_url=$(terraform -chdir=infra output -json site_urls | jq -r '[.[]][0].public')" >> "$GITHUB_OUTPUT"

      # CloudFront's edge caches take a few seconds to pick up a fresh
      # distribution config, so the script retries rather than shooting once.
      - name: Smoke test /api/health
        env:
          PUBLIC_URL: ${{ steps.site.outputs.public_url }}
        run: node .workflow-tools/tools/infra/deploy/smoke-test-health.ts

      # Meaningful only the first time a production account is stood up
      # (issue #30 "Human work" H7), and harmless every other run.
      - name: DNS records to publish
        if: inputs.environment_name == 'hpac-safety-production'
        run: node .workflow-tools/tools/infra/deploy/report-dns-records.ts
